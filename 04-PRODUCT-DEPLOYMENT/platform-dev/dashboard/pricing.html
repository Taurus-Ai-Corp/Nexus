<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro-Loan Pricing — Experiment Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
        integrity="sha386-9mXzFqfPqfPqfPqfPqfPqfPqfPqfPqfPqfPqfPqfPqfPqfPqfPqfPqfPqfPqfPqfP"
        crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-base: #0a0a0a;
            --bg-surface: #141414;
            --bg-elevated: #1e1e1e;
            --text-primary: #f5f5f5;
            --text-secondary: #a0a0a0;
            --text-muted: #666;
            --accent: #d4af37;
            --accent-glow: rgba(212, 175, 55, 0.15);
            --border: #2a2a2a;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 32px;
        }
        header h1 { font-size: 24px; font-weight: 600; }
        header h1 span { color: var(--accent); }
        .status-badge {
            padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500;
        }
        .status-healthy { background: rgba(34,197,94,0.15); color: var(--success); }
        .status-degraded { background: rgba(245,158,11,0.15); color: var(--warning); }
        .status-critical { background: rgba(239,68,68,0.15); color: var(--danger); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .card {
            background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px;
        }
        .card h3 { font-size: 14px; color: var(--text-secondary); margin-bottom: 8px; }
        .card .value { font-size: 32px; font-weight: 700; }
        .card .value.accent { color: var(--accent); }
        .card .sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .chart-container {
            background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; margin-bottom: 20px;
        }
        .chart-container h3 { font-size: 16px; margin-bottom: 16px; }
        .experiments-table { width: 100%; border-collapse: collapse; }
        .experiments-table th, .experiments-table td {
            padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        .experiments-table th { color: var(--text-secondary); font-weight: 500; }
        .experiments-table tr:hover { background: var(--bg-elevated); }
        .btn {
            padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer;
            font-size: 14px; font-weight: 500; transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
        .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
        .loading { text-align: center; padding: 40px; color: var(--text-muted); }
        .error { color: var(--danger); padding: 12px; background: rgba(239,68,68,0.1); border-radius: 8px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px 14px; background: var(--bg-elevated);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary);
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: var(--accent);
        }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }
        .modal {
            background: var(--bg-surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 32px; width: 100%; max-width: 480px;
        }
        .modal h2 { font-size: 20px; margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><span>Micro-Loan</span> Pricing Dashboard</h1>
            <div id="statusBadge" class="status-badge status-healthy">Loading...</div>
        </header>

        <div class="grid">
            <div class="card">
                <h3>Model Status</h3>
                <div id="modelStatus" class="value">—</div>
                <div id="modelSub" class="sub"></div>
            </div>
            <div class="card">
                <h3>Best Reward</h3>
                <div id="bestReward" class="value accent">—</div>
                <div id="rewardSub" class="sub"></div>
            </div>
            <div class="card">
                <h3>Total Timesteps</h3>
                <div id="totalSteps" class="value">—</div>
                <div id="stepsSub" class="sub"></div>
            </div>
            <div class="card">
                <h3>Experiments</h3>
                <div id="expCount" class="value">—</div>
                <div id="expSub" class="sub"></div>
            </div>
        </div>

        <div class="chart-container">
            <h3>Training Progress</h3>
            <canvas id="trainingChart" height="80"></canvas>
        </div>

        <div class="chart-container">
            <h3>Reward History</h3>
            <canvas id="rewardChart" height="80"></canvas>
        </div>

        <div class="chart-container">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <h3 style="margin:0;">Experiments</h3>
                <button class="btn btn-primary" onclick="showNewExperiment()">+ New Experiment</button>
            </div>
            <table class="experiments-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Algorithm</th>
                        <th>Timesteps</th>
                        <th>Best Reward</th>
                        <th>Status</th>
                        <th>Completed</th>
                    </tr>
                </thead>
                <tbody id="experimentsBody">
                    <tr><td colspan="6" class="loading">Loading experiments...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="newExperimentModal" class="modal-overlay hidden">
        <div class="modal">
            <h2>New Training Experiment</h2>
            <div class="form-group">
                <label for="expName">Experiment Name</label>
                <input type="text" id="expName" placeholder="e.g., pricing_v2" pattern="^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$" required>
            </div>
            <div class="form-group">
                <label for="timesteps">Timesteps</label>
                <input type="number" id="timesteps" value="50000" min="1000" max="10000000" step="1000">
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="hideNewExperiment()">Cancel</button>
                <button class="btn btn-primary" onclick="startTraining()">Start Training</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let authToken = null;
        let trainingChart = null;
        let rewardChart = null;

        async function init() {
            const token = prompt('Enter admin password (default: admin123):');
            if (!token) return;

            try {
                const resp = await fetch(`${API_BASE}/auth/token?username=admin&password=${encodeURIComponent(token)}`, {
                    method: 'POST'
                });
                if (!resp.ok) {
                    alert('Authentication failed');
                    return;
                }
                const data = await resp.json();
                authToken = data.access_token;
                await loadDashboard();
            } catch (e) {
                alert('Connection error: ' + e.message);
            }
        }

        async function loadDashboard() {
            await Promise.all([loadStatus(), loadExperiments()]);
        }

        async function loadStatus() {
            try {
                const resp = await fetch(`${API_BASE}/api/pricing/status`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!resp.ok) return;
                const data = await resp.json();

                document.getElementById('modelStatus').textContent = data.has_model ? 'Loaded' : 'Not Trained';
                document.getElementById('modelSub').textContent = data.has_model ? 'Model ready for predictions' : 'Run an experiment to train';

                const reward = data.best_reward;
                document.getElementById('bestReward').textContent = reward !== null ? reward.toFixed(2) : '—';
                document.getElementById('rewardSub').textContent = reward !== null ? 'Higher is better' : '';

                const steps = data.total_timesteps;
                document.getElementById('totalSteps').textContent = steps > 0 ? formatNumber(steps) : '—';
                document.getElementById('stepsSub').textContent = steps > 0 ? 'Total training steps' : '';

                document.getElementById('expCount').textContent = data.experiments ? data.experiments.length : 0;
                document.getElementById('expSub').textContent = 'Total experiments run';

                updateCharts(data);
            } catch (e) {
                console.error('Status load error:', e);
            }
        }

        async function loadExperiments() {
            try {
                const resp = await fetch(`${API_BASE}/api/pricing/status`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!resp.ok) return;
                const data = await resp.json();

                const tbody = document.getElementById('experimentsBody');
                if (!data.experiments || data.experiments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="loading">No experiments yet. Click "+ New Experiment" to start.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.experiments.map(exp => {
                    const reward = exp.final_best_reward || exp.metrics_history?.[exp.metrics_history.length - 1]?.best_reward;
                    const status = exp.completed_at ? 'Completed' : 'In Progress';
                    return `<tr>
                        <td>${escapeHtml(exp.experiment_name)}</td>
                        <td>${exp.algorithm || 'PPO'}</td>
                        <td>${formatNumber(exp.total_timesteps || 0)}</td>
                        <td>${reward !== null && reward !== undefined ? reward.toFixed(2) : '—'}</td>
                        <td><span class="status-badge ${status === 'Completed' ? 'status-healthy' : 'status-degraded'}">${status}</span></td>
                        <td>${exp.completed_at ? new Date(exp.completed_at).toLocaleDateString() : '—'}</td>
                    </tr>`;
                }).join('');
            } catch (e) {
                console.error('Experiments load error:', e);
            }
        }

        function updateCharts(data) {
            const experiments = data.experiments || [];
            if (experiments.length === 0) return;

            const lastExp = experiments[experiments.length - 1];
            const history = lastExp.metrics_history || [];

            const labels = history.map(h => `Step ${h.step}`);
            const rewards = history.map(h => h.mean_reward);
            const bestRewards = history.map(h => h.best_reward);

            if (trainingChart) trainingChart.destroy();
            if (rewardChart) rewardChart.destroy();

            const ctx1 = document.getElementById('trainingChart').getContext('2d');
            trainingChart = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Mean Reward',
                        data: rewards,
                        borderColor: '#d4af37',
                        backgroundColor: 'rgba(212,175,55,0.1)',
                        fill: true,
                        tension: 0.4,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: true, labels: { color: '#a0a0a0' } } },
                    scales: {
                        x: { ticks: { color: '#666' }, grid: { color: '#2a2a2a' } },
                        y: { ticks: { color: '#666' }, grid: { color: '#2a2a2a' } }
                    }
                }
            });

            const ctx2 = document.getElementById('rewardChart').getContext('2d');
            rewardChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: experiments.map(e => e.experiment_name),
                    datasets: [{
                        label: 'Final Best Reward',
                        data: experiments.map(e => e.final_best_reward || 0),
                        backgroundColor: 'rgba(212,175,55,0.6)',
                        borderColor: '#d4af37',
                        borderWidth: 1,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#666' }, grid: { color: '#2a2a2a' } },
                        y: { ticks: { color: '#666' }, grid: { color: '#2a2a2a' } }
                    }
                }
            });
        }

        function showNewExperiment() {
            document.getElementById('newExperimentModal').classList.remove('hidden');
        }

        function hideNewExperiment() {
            document.getElementById('newExperimentModal').classList.add('hidden');
        }

        async function startTraining() {
            const name = document.getElementById('expName').value.trim();
            const steps = parseInt(document.getElementById('timesteps').value);

            if (!name || !/^[a-zA-Z0-9][a-zA-Z0-9_-]{0,63}$/.test(name)) {
                alert('Invalid experiment name. Use alphanumeric, hyphens, and underscores only.');
                return;
            }
            if (steps < 1000 || steps > 10000000) {
                alert('Timesteps must be between 1,000 and 10,000,000.');
                return;
            }

            hideNewExperiment();

            try {
                const resp = await fetch(`${API_BASE}/api/pricing/train`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ experiment_name: name, timesteps: steps }),
                });
                const result = await resp.json();
                if (resp.ok) {
                    alert(`Training started: ${name}`);
                    await loadDashboard();
                } else {
                    alert('Error: ' + JSON.stringify(result));
                }
            } catch (e) {
                alert('Connection error: ' + e.message);
            }
        }

        function formatNumber(n) {
            return n.toLocaleString();
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        init();
    </script>
</body>
</html>
