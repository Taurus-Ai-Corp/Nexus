version: '3.8'

services:
  # Core AI Agent Service
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: neovibe-ai-agent
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/microloan_db
      - REDIS_URL=redis://redis:6379
      - AWS_REGION=ap-south-1
      - DATA_LOCALIZATION=true
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - db
      - redis
    networks:
      - neovibe-network
    restart: unless-stopped

  # Web Dashboard
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: neovibe-dashboard
    ports:
      - "3000:80"
    environment:
      - API_URL=http://ai-agent:8000
    depends_on:
      - ai-agent
    networks:
      - neovibe-network
    restart: unless-stopped

  # PostgreSQL Database (India region compliant)
  db:
    image: postgres:16-alpine
    container_name: neovibe-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=microloan_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - neovibe-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: neovibe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - neovibe-network
    restart: unless-stopped

  # Nginx Reverse Proxy (Optional for production)
  nginx:
    image: nginx:alpine
    container_name: neovibe-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - ai-agent
      - dashboard
    networks:
      - neovibe-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  neovibe-network:
    driver: bridge