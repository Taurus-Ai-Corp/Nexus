services:
  # 🤖 Ollama - Local AI Models (Minimal Setup)
  ollama:
    image: ollama/ollama:latest
    container_name: taurus-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_ORIGINS=*
    networks:
      - ai-empire

  # 🗄️ Supabase Database - Local Data Storage
  supabase-db:
    image: postgres:15
    container_name: taurus-supabase-db
    ports:
      - "54322:5432"
    environment:
      POSTGRES_DB: taurus_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your-super-secret-jwt-token-with-at-least-32-characters-long
    volumes:
      - supabase_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - ai-empire

volumes:
  ollama_data:
    driver: local
  supabase_data:
    driver: local

networks:
  ai-empire:
    driver: bridge