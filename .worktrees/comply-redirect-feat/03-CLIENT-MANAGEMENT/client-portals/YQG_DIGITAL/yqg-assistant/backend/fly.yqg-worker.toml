# Fly.io deployment config for the YQG-persona LiveKit worker.
# Drop into the NEXUS-LOCAL backend repo root and deploy with:
#   fly launch --config fly.yqg-worker.toml --name nexus-local-worker-yqg --no-deploy
#   fly deploy --config fly.yqg-worker.toml --remote-only

app = "nexus-local-worker-yqg"
primary_region = "iad"          # US-East — closest to Windsor, Ontario

[build]
  dockerfile = "Dockerfile"

[deploy]
  # The worker connects outbound to LiveKit Cloud via WebSocket; no inbound HTTP.
  strategy = "immediate"

[processes]
  worker = "python -m src.integrations.yqg_worker start"

[env]
  NEXUS_AGENT_NAME = "yqg-agent"
  LOG_LEVEL = "info"

# No [services] block — this worker is outbound-only, no public endpoint.

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
