# Atlas AI Website Pipeline Configuration

name: atlas-ai-pipeline
version: '1.0'

# Environment Configuration
environment:
  node_version: '18.x'
  npm_version: 'latest'
  build_tool: 'next.js'
  deployment_target: 'static'

# Pipeline Stages
stages:
  - name: setup
    description: "Install dependencies and setup environment"
    commands:
      - npm install
      - npm audit fix
    success_criteria:
      - "node_modules directory exists"
      - "no high-severity vulnerabilities"

  - name: quality-check
    description: "Code quality and type checking"
    commands:
      - npm run lint
      - npm run type-check
      - npm run format:check
    success_criteria:
      - "zero linting errors"
      - "no TypeScript errors"
      - "code formatting passes"

  - name: test
    description: "Comprehensive testing suite"
    commands:
      - npm run test:unit
      - npm run test:integration
      - npm run test:accessibility
      - npm run test:performance
    success_criteria:
      - "all unit tests pass"
      - "integration tests pass"
      - "accessibility score > 95"
      - "lighthouse score > 90"

  - name: build
    description: "Production build and optimization"
    commands:
      - npm run build
      - npm run analyze:bundle
    success_criteria:
      - "build completes successfully"
      - "bundle size within limits"
      - "all pages pre-rendered"
    artifacts:
      - ".next/static/**"
      - ".next/server/**"

  - name: deploy
    description: "Deploy to production"
    commands:
      - deploy --dist .next --project atlas-ai-enhanced
    success_criteria:
      - "deployment succeeds"
      - "health check passes"
      - "all routes accessible"

# Quality Gates
quality_gates:
  accessibility:
    tool: "axe-core"
    minimum_score: 95
    critical_violations: 0

  performance:
    tool: "lighthouse"
    metrics:
      - name: "First Contentful Paint"
        threshold: "< 2s"
      - name: "Largest Contentful Paint"
        threshold: "< 4s"
      - name: "Cumulative Layout Shift"
        threshold: "< 0.1"

  security:
    tool: "npm audit"
    high_severity: 0
    critical_severity: 0

  seo:
    tool: "lighthouse"
    minimum_score: 90
    requirements:
      - "meta descriptions present"
      - "structured data valid"
      - "social media tags complete"

# Monitoring Configuration
monitoring:
  uptime:
    url: "https://jirhbsr312g3.space.minimax.io"
    interval: "5m"
    timeout: "30s"

  performance:
    lighthouse_ci: true
    budget:
      - resourceType: "script"
        budget: 300
      - resourceType: "image"
        budget: 500

  alerts:
    - type: "uptime"
      threshold: "< 99%"
      action: "notify_team"
    - type: "performance"
      threshold: "score < 90"
      action: "create_issue"

# Automation Scripts
automation:
  daily_checks:
    - "npm audit"
    - "lighthouse performance check"
    - "broken link scanner"

  weekly_maintenance:
    - "dependency updates"
    - "security scan"
    - "content freshness check"

  monthly_reviews:
    - "performance analysis"
    - "user experience audit"
    - "seo optimization review"

# Rollback Strategy
rollback:
  trigger_conditions:
    - "build failure"
    - "critical accessibility violations"
    - "performance regression > 20%"
  
  procedure:
    - "revert to last known good deployment"
    - "notify development team"
    - "create incident report"

# Documentation Links
documentation:
  setup: "docs/setup.md"
  deployment: "docs/deployment.md"
  troubleshooting: "docs/troubleshooting.md"
  maintenance: "docs/maintenance.md"