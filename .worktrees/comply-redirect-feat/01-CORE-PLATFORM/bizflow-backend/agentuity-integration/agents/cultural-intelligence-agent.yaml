# Cultural Intelligence Agent
# Purpose: Market research & cultural analysis for Dubai/India markets

agent:
  name: "Cultural Intelligence Agent"
  version: "1.0.0"
  description: "AI-powered cultural intelligence for market research and cultural adaptation"
  
  # Core Capabilities
  capabilities:
    - "Market trend analysis"
    - "Cultural adaptation insights"
    - "Competitor benchmarking"
    - "Local market intelligence"
    - "Ramadan/Diwali campaign optimization"
    - "Arabic/Indian cultural context analysis"

  # MCP Server Integrations
  mcp_integrations:
    website_downloader:
      purpose: "Market research and competitor analysis"
      functions:
        - "Download competitor websites"
        - "Analyze market trends"
        - "Monitor cultural content"
        - "Track local campaigns"
    
    design_tokens:
      purpose: "Cultural color and design preferences"
      functions:
        - "Cultural color analysis"
        - "Design preference mapping"
        - "Brand adaptation guidelines"

  # Input Schema
  input_schema:
    type: "object"
    properties:
      market:
        type: "string"
        enum: ["dubai", "india", "mena", "global"]
        description: "Target market for analysis"
      industry:
        type: "string"
        description: "Industry vertical (luxury, tech, healthcare, etc.)"
      campaign_type:
        type: "string"
        enum: ["brand_awareness", "lead_generation", "sales", "retention"]
        description: "Type of marketing campaign"
      cultural_context:
        type: "object"
        properties:
          season:
            type: "string"
            enum: ["ramadan", "diwali", "eid", "holi", "regular"]
          language_preference:
            type: "string"
            enum: ["arabic", "hindi", "english", "multilingual"]
          cultural_sensitivity:
            type: "string"
            enum: ["high", "medium", "low"]
      budget_range:
        type: "string"
        enum: ["$10K-$25K", "$25K-$50K", "$50K-$100K", "$100K+"]
        description: "Campaign budget range"

  # Output Schema
  output_schema:
    type: "object"
    properties:
      cultural_insights:
        type: "object"
        properties:
          key_cultural_factors:
            type: "array"
            items:
              type: "string"
          seasonal_considerations:
            type: "array"
            items:
              type: "string"
          language_recommendations:
            type: "array"
            items:
              type: "string"
          visual_preferences:
            type: "object"
            properties:
              colors:
                type: "array"
                items:
                  type: "string"
              imagery_style:
                type: "string"
              typography:
                type: "string"
      
      market_analysis:
        type: "object"
        properties:
          market_size:
            type: "string"
          growth_rate:
            type: "string"
          key_competitors:
            type: "array"
            items:
              type: "string"
          market_gaps:
            type: "array"
            items:
              type: "string"
      
      campaign_recommendations:
        type: "object"
        properties:
          optimal_timing:
            type: "string"
          channel_priorities:
            type: "array"
            items:
              type: "string"
          content_themes:
            type: "array"
            items:
              type: "string"
          budget_allocation:
            type: "object"
            properties:
              digital_ads:
                type: "string"
              influencer_marketing:
                type: "string"
              content_creation:
                type: "string"
              events:
                type: "string"

  # Business Logic
  business_logic:
    dubai_market:
      cultural_factors:
        - "Ramadan timing and messaging"
        - "Luxury lifestyle integration"
        - "Arabic-English bilingual content"
        - "VIP experience focus"
        - "Cultural celebration moments"
      optimal_channels:
        - "Instagram (luxury lifestyle)"
        - "LinkedIn (B2B luxury)"
        - "YouTube (brand storytelling)"
        - "TikTok (young luxury consumers)"
    
    india_market:
      cultural_factors:
        - "Diwali and festival seasons"
        - "Regional language preferences"
        - "Family-oriented messaging"
        - "Value-conscious positioning"
        - "Mobile-first approach"
      optimal_channels:
        - "WhatsApp (family sharing)"
        - "Instagram (visual storytelling)"
        - "YouTube (educational content)"
        - "Facebook (community building)"

  # Performance Metrics
  success_metrics:
    cultural_accuracy:
      target: "95%"
      description: "Accuracy of cultural recommendations"
    market_insight_quality:
      target: "9.2/10"
      description: "Quality score of market insights"
    campaign_relevance:
      target: "90%"
      description: "Cultural relevance of campaign recommendations"
    client_satisfaction:
      target: "9.4/10"
      description: "Client satisfaction with cultural intelligence"

  # Revenue Impact
  revenue_impact:
    q1_target: "$150K"
    q2_target: "$300K"
    q3_target: "$500K"
    q4_target: "$750K"
    roi_contribution: "40% of total campaign success"

  # Integration Points
  integration_points:
    content_creation_agent:
      data_flow: "Cultural insights → Content themes and visual guidelines"
    campaign_optimization_agent:
      data_flow: "Market analysis → Performance benchmarks and optimization targets"
    lead_generation_agent:
      data_flow: "Cultural preferences → Lead qualification criteria and nurturing sequences"
    client_communication_agent:
      data_flow: "Market intelligence → Client reporting and recommendations"

  # Example Use Cases
  example_use_cases:
    - "Swiss watch brand Dubai launch (574% ROI achieved)"
    - "Luxury fashion brand Ramadan campaign"
    - "Tech startup India market entry"
    - "Healthcare brand cultural adaptation"
    - "Financial services Diwali campaign"

  # Automation Rules
  automation_rules:
    - "Auto-detect cultural seasons and adjust recommendations"
    - "Monitor competitor campaigns and provide real-time insights"
    - "Update market data weekly with latest trends"
    - "Generate cultural risk assessments for all campaigns"
    - "Provide multilingual content recommendations"
