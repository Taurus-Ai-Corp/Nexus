# Content Creation Agent
# Purpose: Automated content generation for campaigns using MCP design tools

agent:
  name: "Content Creation Agent"
  version: "1.0.0"
  description: "AI-powered content creation with design automation and brand adaptation"

  # Core Capabilities
  capabilities:
    - "Visual asset generation"
    - "Brand adaptation"
    - "Multi-channel content creation"
    - "Cultural customization"
    - "Automated design workflows"
    - "Template-based content generation"

  # MCP Server Integrations
  mcp_integrations:
    figma:
      purpose: "Design asset creation and management"
      functions:
        - "Create brand templates"
        - "Generate visual assets"
        - "Adapt designs for different markets"
        - "Export assets for multiple channels"
      integration_type: "API-based automation"
    
    design_tokens:
      purpose: "Brand consistency and visual identity"
      functions:
        - "Apply brand colors and typography"
        - "Maintain design system consistency"
        - "Generate brand-compliant variations"
        - "Create market-specific adaptations"
      integration_type: "Token-based styling"
    
    tailwind:
      purpose: "Responsive design and CSS generation"
      functions:
        - "Generate responsive layouts"
        - "Create mobile-optimized designs"
        - "Apply utility-first styling"
        - "Optimize for web performance"
      integration_type: "CSS utility automation"
    
    components:
      purpose: "Reusable UI component management"
      functions:
        - "Generate component variations"
        - "Create client-specific adaptations"
        - "Maintain component library"
        - "Export components for development"
      integration_type: "Component-based architecture"
    
    icons:
      purpose: "Visual elements and brand icons"
      functions:
        - "Generate contextual icons"
        - "Create brand-specific iconography"
        - "Optimize icons for different platforms"
        - "Maintain icon consistency"
      integration_type: "Icon asset management"

  # Input Schema
  input_schema:
    type: "object"
    properties:
      campaign_brief:
        type: "object"
        properties:
          brand_name:
            type: "string"
            description: "Client brand name"
          industry:
            type: "string"
            description: "Industry vertical"
          target_market:
            type: "string"
            enum: ["dubai", "india", "mena", "global"]
          campaign_objective:
            type: "string"
            enum: ["brand_awareness", "lead_generation", "sales", "retention"]
          budget_range:
            type: "string"
            enum: ["$10K-$25K", "$25K-$50K", "$50K-$100K", "$100K+"]
      
      content_requirements:
        type: "object"
        properties:
          content_types:
            type: "array"
            items:
              type: "string"
              enum: ["social_media", "web_banner", "email_template", "presentation", "video_thumbnail"]
          channels:
            type: "array"
            items:
              type: "string"
              enum: ["instagram", "linkedin", "youtube", "tiktok", "facebook", "email", "web"]
          languages:
            type: "array"
            items:
              type: "string"
              enum: ["english", "arabic", "hindi", "multilingual"]
          cultural_context:
            type: "object"
            properties:
              season:
                type: "string"
                enum: ["ramadan", "diwali", "eid", "holi", "regular"]
              cultural_sensitivity:
                type: "string"
                enum: ["high", "medium", "low"]
      
      brand_guidelines:
        type: "object"
        properties:
          primary_colors:
            type: "array"
            items:
              type: "string"
          secondary_colors:
            type: "array"
            items:
              type: "string"
          typography:
            type: "object"
            properties:
              primary_font:
                type: "string"
              secondary_font:
                type: "string"
          logo_variations:
            type: "array"
            items:
              type: "string"
          brand_voice:
            type: "string"
            enum: ["luxury", "professional", "casual", "innovative", "traditional"]

  # Output Schema
  output_schema:
    type: "object"
    properties:
      generated_assets:
        type: "object"
        properties:
          social_media:
            type: "array"
            items:
              type: "object"
              properties:
                platform:
                  type: "string"
                asset_type:
                  type: "string"
                file_path:
                  type: "string"
                dimensions:
                  type: "string"
                cultural_adaptation:
                  type: "string"
          
          web_assets:
            type: "array"
            items:
              type: "object"
              properties:
                asset_type:
                  type: "string"
                file_path:
                  type: "string"
                responsive_versions:
                  type: "array"
                  items:
                    type: "string"
                optimization_status:
                  type: "string"
          
          email_templates:
            type: "array"
            items:
              type: "object"
              properties:
                template_name:
                  type: "string"
                file_path:
                  type: "string"
                email_client_compatibility:
                  type: "array"
                  items:
                    type: "string"
                mobile_optimized:
                  type: "boolean"
      
      content_strategy:
        type: "object"
        properties:
          visual_themes:
            type: "array"
            items:
              type: "string"
          messaging_framework:
            type: "object"
            properties:
              primary_message:
                type: "string"
              supporting_messages:
                type: "array"
                items:
                  type: "string"
              cultural_adaptations:
                type: "array"
                items:
                  type: "string"
          
          distribution_plan:
            type: "object"
            properties:
              channel_priorities:
                type: "array"
                items:
                  type: "string"
              posting_schedule:
                type: "object"
              content_mix:
                type: "object"
                properties:
                  original_content:
                    type: "string"
                  user_generated_content:
                    type: "string"
                  curated_content:
                    type: "string"

  # Business Logic
  content_generation_workflow:
    step_1_analysis:
      - "Analyze brand guidelines and cultural context"
      - "Identify optimal visual themes and messaging"
      - "Determine content mix and channel priorities"
    
    step_2_design:
      - "Generate base templates using Figma integration"
      - "Apply design tokens for brand consistency"
      - "Create responsive layouts with Tailwind"
      - "Add contextual icons and visual elements"
    
    step_3_adaptation:
      - "Create market-specific variations"
      - "Apply cultural customizations"
      - "Generate multilingual versions"
      - "Optimize for different platforms"
    
    step_4_export:
      - "Export assets in required formats"
      - "Generate component library entries"
      - "Create development-ready assets"
      - "Prepare for multi-channel distribution"

  # Performance Metrics
  success_metrics:
    asset_generation_speed:
      target: "50 assets per hour"
      description: "Speed of automated asset generation"
    brand_consistency_score:
      target: "98%"
      description: "Consistency with brand guidelines"
    cultural_accuracy:
      target: "95%"
      description: "Accuracy of cultural adaptations"
    client_satisfaction:
      target: "9.2/10"
      description: "Client satisfaction with generated content"
    cost_efficiency:
      target: "80% cost reduction"
      description: "Reduction in content creation costs"

  # Revenue Impact
  revenue_impact:
    q1_target: "$300K"
    q2_target: "$500K"
    q3_target: "$750K"
    q4_target: "$1M"
    roi_contribution: "60% of total campaign success"
    cost_savings: "$50K per month in design costs"

  # Integration Points
  integration_points:
    cultural_intelligence_agent:
      data_flow: "Cultural insights → Content themes and visual guidelines"
    campaign_optimization_agent:
      data_flow: "Performance data → Content optimization recommendations"
    lead_generation_agent:
      data_flow: "Lead magnets → Content creation for conversion"
    client_communication_agent:
      data_flow: "Client feedback → Content iteration and improvement"

  # Example Use Cases
  example_use_cases:
    - "Swiss watch brand: 30 pieces of culturally-relevant content in 7 days"
    - "Luxury fashion: Instagram carousel series with Arabic-English adaptation"
    - "Tech startup: Multi-platform launch campaign with responsive designs"
    - "Healthcare brand: Culturally-sensitive visual content for Ramadan"
    - "Financial services: Professional LinkedIn content with local insights"

  # Automation Rules
  automation_rules:
    - "Auto-generate content variations for A/B testing"
    - "Apply cultural adaptations based on market intelligence"
    - "Maintain brand consistency across all generated assets"
    - "Optimize assets for platform-specific requirements"
    - "Generate multilingual content automatically"
    - "Create responsive versions for all web assets"
    - "Apply accessibility standards to all content"
    - "Generate SEO-optimized alt text and descriptions"
