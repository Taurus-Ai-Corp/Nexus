# Agentuity Cloud Deployment Configuration
# Vibe Marketing Empire - Production Deployment

deployment:
  name: "vibe-marketing-empire"
  version: "1.0.0"
  environment: "production"
  region: "us-east-1"
  
  # Project Overview
  project_info:
    name: "Vibe Marketing Empire"
    description: "AI-powered marketing automation platform with cultural intelligence"
    target_revenue: "$1.7M Year 1"
    market_focus: "Dubai & India luxury markets"
    unique_value: "Cultural intelligence + AI automation"

  # Infrastructure Configuration
  infrastructure:
    compute:
      type: "serverless"
      provider: "aws-lambda"
      memory: "2048MB"
      timeout: "900s"
      concurrency: 100
    
    storage:
      type: "s3"
      bucket: "vibe-marketing-empire-assets"
      region: "us-east-1"
      encryption: "AES-256"
    
    database:
      type: "dynamodb"
      tables:
        - "campaigns"
        - "clients"
        - "performance-metrics"
        - "cultural-insights"
        - "content-assets"
    
    cache:
      type: "redis"
      cluster: "vibe-marketing-cache"
      memory: "2GB"
      persistence: true

  # Agent Deployments
  agents:
    cultural_intelligence_agent:
      name: "cultural-intelligence"
      version: "1.0.0"
      replicas: 3
      resources:
        cpu: "1000m"
        memory: "2Gi"
      environment:
        - name: "MARKET_DATA_API_KEY"
          value: "${MARKET_DATA_API_KEY}"
        - name: "CULTURAL_INSIGHTS_DB"
          value: "cultural-insights"
        - name: "WEBSITE_DOWNLOADER_URL"
          value: "${WEBSITE_DOWNLOADER_URL}"
      health_check:
        path: "/health"
        interval: "30s"
        timeout: "10s"
        retries: 3
      scaling:
        min_replicas: 2
        max_replicas: 10
        target_cpu: "70%"
        target_memory: "80%"
    
    content_creation_agent:
      name: "content-creation"
      version: "1.0.0"
      replicas: 5
      resources:
        cpu: "2000m"
        memory: "4Gi"
      environment:
        - name: "FIGMA_ACCESS_TOKEN"
          value: "${FIGMA_ACCESS_TOKEN}"
        - name: "DESIGN_TOKENS_PATH"
          value: "/app/design-tokens"
        - name: "COMPONENT_LIBRARY_URL"
          value: "${COMPONENT_LIBRARY_URL}"
        - name: "ICON_ASSETS_URL"
          value: "${ICON_ASSETS_URL}"
      health_check:
        path: "/health"
        interval: "30s"
        timeout: "15s"
        retries: 3
      scaling:
        min_replicas: 3
        max_replicas: 15
        target_cpu: "75%"
        target_memory: "85%"
    
    campaign_optimization_agent:
      name: "campaign-optimization"
      version: "1.0.0"
      replicas: 4
      resources:
        cpu: "1500m"
        memory: "3Gi"
      environment:
        - name: "ANALYTICS_API_KEY"
          value: "${ANALYTICS_API_KEY}"
        - name: "PERFORMANCE_DB"
          value: "performance-metrics"
        - name: "OPTIMIZATION_ALGORITHM"
          value: "ml-optimization-v2"
      health_check:
        path: "/health"
        interval: "30s"
        timeout: "10s"
        retries: 3
      scaling:
        min_replicas: 2
        max_replicas: 12
        target_cpu: "70%"
        target_memory: "80%"
    
    lead_generation_agent:
      name: "lead-generation"
      version: "1.0.0"
      replicas: 3
      resources:
        cpu: "1000m"
        memory: "2Gi"
      environment:
        - name: "CRM_API_KEY"
          value: "${CRM_API_KEY}"
        - name: "EMAIL_SERVICE_URL"
          value: "${EMAIL_SERVICE_URL}"
        - name: "LEAD_SCORING_MODEL"
          value: "cultural-lead-scoring-v1"
      health_check:
        path: "/health"
        interval: "30s"
        timeout: "10s"
        retries: 3
      scaling:
        min_replicas: 2
        max_replicas: 8
        target_cpu: "70%"
        target_memory: "80%"
    
    client_communication_agent:
      name: "client-communication"
      version: "1.0.0"
      replicas: 2
      resources:
        cpu: "1000m"
        memory: "2Gi"
      environment:
        - name: "CLIENT_DB"
          value: "clients"
        - name: "REPORTING_SERVICE_URL"
          value: "${REPORTING_SERVICE_URL}"
        - name: "NOTIFICATION_SERVICE_URL"
          value: "${NOTIFICATION_SERVICE_URL}"
      health_check:
        path: "/health"
        interval: "30s"
        timeout: "10s"
        retries: 3
      scaling:
        min_replicas: 1
        max_replicas: 6
        target_cpu: "70%"
        target_memory: "80%"

  # MCP Server Integrations
  mcp_integrations:
    figma:
      enabled: true
      endpoint: "${FIGMA_MCP_URL}"
      authentication:
        type: "token"
        token: "${FIGMA_ACCESS_TOKEN}"
      health_check:
        path: "/health"
        interval: "60s"
    
    design_tokens:
      enabled: true
      endpoint: "${DESIGN_TOKENS_MCP_URL}"
      configuration:
        tokens_path: "/app/design-tokens"
      health_check:
        path: "/health"
        interval: "60s"
    
    tailwind:
      enabled: true
      endpoint: "${TAILWIND_MCP_URL}"
      health_check:
        path: "/health"
        interval: "60s"
    
    components:
      enabled: true
      endpoint: "${COMPONENTS_MCP_URL}"
      health_check:
        path: "/health"
        interval: "60s"
    
    icons:
      enabled: true
      endpoint: "${ICONS_MCP_URL}"
      health_check:
        path: "/health"
        interval: "60s"
    
    website_downloader:
      enabled: true
      endpoint: "${WEBSITE_DOWNLOADER_URL}"
      health_check:
        path: "/health"
        interval: "60s"

  # Workflow Deployments
  workflows:
    campaign_launch_30day:
      name: "30-day-campaign-launch"
      triggers:
        - type: "webhook"
          endpoint: "/webhooks/campaign-launch"
        - type: "schedule"
          cron: "0 0 * * *"
      steps:
        - agent: "cultural-intelligence"
          timeout: "300s"
        - agent: "content-creation"
          timeout: "600s"
        - agent: "campaign-optimization"
          timeout: "300s"
        - agent: "lead-generation"
          timeout: "300s"
        - agent: "client-communication"
          timeout: "180s"
    
    client_onboarding:
      name: "client-onboarding"
      triggers:
        - type: "webhook"
          endpoint: "/webhooks/client-onboarding"
      steps:
        - agent: "cultural-intelligence"
          timeout: "300s"
        - agent: "content-creation"
          timeout: "600s"
        - agent: "client-communication"
          timeout: "180s"

  # Monitoring & Observability
  monitoring:
    metrics:
      - "agent_performance"
      - "workflow_execution_time"
      - "mcp_integration_health"
      - "revenue_impact"
      - "client_satisfaction"
    
    alerts:
      - name: "high_error_rate"
        condition: "error_rate > 5%"
        severity: "critical"
        notification: "slack"
      
      - name: "low_roi"
        condition: "roi < 200%"
        severity: "warning"
        notification: "email"
      
      - name: "mcp_server_down"
        condition: "mcp_health_check_failed"
        severity: "critical"
        notification: "slack"
    
    dashboards:
      - name: "vibe-marketing-overview"
        metrics:
          - "total_revenue"
          - "active_campaigns"
          - "client_satisfaction"
          - "roi_performance"
      
      - name: "agent-performance"
        metrics:
          - "agent_response_time"
          - "agent_success_rate"
          - "agent_resource_usage"
          - "workflow_completion_rate"

  # Security Configuration
  security:
    authentication:
      type: "jwt"
      issuer: "vibe-marketing-empire"
      audience: "vibe-clients"
    
    authorization:
      rbac:
        enabled: true
        roles:
          - "admin"
          - "client"
          - "agent"
          - "viewer"
    
    encryption:
      at_rest: "AES-256"
      in_transit: "TLS-1.3"
    
    network:
      vpc: "vibe-marketing-vpc"
      subnets:
        - "private-subnet-1"
        - "private-subnet-2"
      security_groups:
        - "vibe-marketing-sg"

  # Backup & Recovery
  backup:
    schedule: "0 2 * * *"
    retention: "30 days"
    locations:
      - "s3://vibe-marketing-backups"
      - "s3://vibe-marketing-backups-secondary"
    
    recovery:
      rto: "4 hours"
      rpo: "1 hour"
      testing_schedule: "monthly"

  # Cost Optimization
  cost_optimization:
    auto_scaling: true
    spot_instances: true
    reserved_capacity: "70%"
    budget_alerts:
      - threshold: "$10,000"
        notification: "email"
      - threshold: "$15,000"
        notification: "slack"

  # Performance Targets
  performance_targets:
    availability: "99.9%"
    response_time: "< 2s"
    throughput: "1000 requests/second"
    error_rate: "< 1%"
    roi_target: "574%"
    client_satisfaction: "9.5/10"

  # Deployment Strategy
  deployment_strategy:
    type: "blue-green"
    rollback_threshold: "5% error rate"
    health_check_timeout: "300s"
    canary_percentage: "10%"
    promotion_criteria:
      - "error_rate < 1%"
      - "response_time < 2s"
      - "roi > 200%"
