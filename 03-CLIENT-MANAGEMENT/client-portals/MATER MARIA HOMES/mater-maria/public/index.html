<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Under Maintenance — Mater Maria Homes</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0}
  body{
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#0a0a0f;
    color:#e8e6e3;
    text-align:center;
    padding:2rem;
  }
  .card{
    max-width:480px;
    padding:3rem 2rem;
    border:1px solid rgba(255,255,255,0.08);
    border-radius:1.5rem;
    background:rgba(255,255,255,0.03);
  }
  .logo{
    font-size:1.5rem;
    font-weight:700;
    letter-spacing:0.08em;
    color:#d4b77a;
    margin-bottom:0.5rem;
  }
  .tagline{
    font-size:0.875rem;
    color:rgba(255,255,255,0.5);
    margin-bottom:2rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
  }
  h1{
    font-size:1.75rem;
    font-weight:600;
    margin-bottom:0.75rem;
    line-height:1.2;
  }
  p{
    font-size:1rem;
    line-height:1.6;
    color:rgba(255,255,255,0.7);
    margin-bottom:1.5rem;
  }
  .badge{
    display:inline-block;
    padding:0.5rem 1rem;
    border-radius:999px;
    font-size:0.75rem;
    font-weight:600;
    letter-spacing:0.05em;
    text-transform:uppercase;
    border:1px solid rgba(212,183,122,0.3);
    color:#d4b77a;
    background:rgba(212,183,122,0.08);
  }
  .contact{
    margin-top:2rem;
    font-size:0.875rem;
    color:rgba(255,255,255,0.5);
  }
  .contact a{
    color:#d4b77a;
    text-decoration:none;
  }
  .contact a:hover{text-decoration:underline}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">MATER MARIA</div>
    <div class="tagline">Living Refined</div>
    <h1>Under Maintenance</h1>
    <p>We are performing scheduled updates and internal testing.<br>Service will resume shortly.</p>
    <div class="badge">503 Service Unavailable</div>
    <div class="contact">
      For urgent enquiries: <a href="mailto:admin@taurusai.io">admin@taurusai.io</a>
    </div>
  </div>
</body>
</html>
