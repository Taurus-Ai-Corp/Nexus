version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Heiro LF configuration (if needed)
      - HEIRO_ENDPOINT=http://heiro-lf:8080/api
      - HEIRO_API_KEY=${HEIRO_API_KEY}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  # Optional: Heiro LF service if self-hosted (comment out if using managed)
  # heiro-lf:
  #   image: hieroledger/heiro:latest
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./heiro-data:/var/lib/heiro
  #   environment:
  #     - HEIRO_NETWORK=testnet
  #   restart: unless-stopped