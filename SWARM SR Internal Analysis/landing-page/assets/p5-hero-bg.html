<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Hero Background</title>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>html,body{margin:0;padding:0;overflow:hidden;background:#fff;}canvas{display:block;}</style>
</head>
<body>
<script>
let nodes = [];
const NODE_COUNT = 42;
const PALETTE = ['#533afd','#ea2261','#f96bee','#061b31','#64748d'];
function setup() {
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB, 360, 100, 100, 100);
  for (let i = 0; i < NODE_COUNT; i++) {
    nodes.push(new Node());
  }
}
function draw() {
  background(0, 0, 100, 100);
  const t = millis() * 0.0003;
  for (let n of nodes) {
    n.update(t);
    n.display();
  }
  // subtle connection lines
  stroke(230, 20, 40, 8);
  strokeWeight(0.5);
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const d = dist(nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y);
      if (d < 140) {
        line(nodes[i].x, nodes[i].y, nodes[j].x, nodes[j].y);
      }
    }
  }
}
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
class Node {
  constructor() {
    this.x = random(width);
    this.y = random(height);
    this.baseX = this.x;
    this.baseY = this.y;
    this.size = random(2, 5);
    this.hue = random([230, 330, 340, 220, 220]);
    this.sat = random(50, 80);
    this.bri = random(40, 70);
    this.speed = random(0.2, 0.6);
    this.phase = random(TWO_PI);
  }
  update(t) {
    this.x = this.baseX + Math.sin(t * this.speed + this.phase) * 30;
    this.y = this.baseY + Math.cos(t * this.speed * 0.7 + this.phase) * 20;
  }
  display() {
    noStroke();
    fill(this.hue, this.sat, this.bri, 25);
    ellipse(this.x, this.y, this.size * 2.5);
    fill(this.hue, this.sat, this.bri, 55);
    ellipse(this.x, this.y, this.size);
  }
}
</script>
</body>
</html>
