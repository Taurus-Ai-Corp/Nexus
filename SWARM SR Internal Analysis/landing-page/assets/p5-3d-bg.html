<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus 3D Ambience</title>
  <script>p5.disableFriendlyErrors = true;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #050b14; }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
let crystals = [];
let cam;

function setup() {
  createCanvas(windowWidth, windowHeight, WEBGL);
  colorMode(HSB, 360, 100, 100, 100);
  cam = createCamera();
  cam.setPosition(0, -120, 520);
  cam.lookAt(0, 0, 0);

  for (let i = 0; i < 18; i++) {
    crystals.push(new Crystal());
  }
}

function draw() {
  background('#050b14');

  // slow camera orbit driven by scroll from parent, plus time
  let t = millis() * 0.00015;
  let orbit = window.parent._nexusScroll || 0;
  cam.setPosition(
    sin(t + orbit * 0.3) * 520,
    -140 + cos(t * 0.7) * 60,
    420 + sin(orbit * 0.2) * 80
  );
  cam.lookAt(0, 0, 0);

  // three-point lighting
  ambientLight(15, 30, 50);
  directionalLight(200, 220, 255, -1, -1, -1);
  directionalLight(80, 120, 180, 1, -0.5, -1);
  pointLight(120, 200, 255, 0, -300, -300);

  noStroke();

  // central platform disc
  push();
  rotateX(PI / 2.4);
  fill(220, 60, 25, 12);
  specularMaterial(200);
  shininess(80);
  cylinder(420, 6, 64);
  pop();

  for (let c of crystals) {
    c.update(t, orbit);
    c.display();
  }

  // subtle floating particles
  push();
  fill(190, 70, 90, 30);
  for (let i = 0; i < 40; i++) {
    let px = sin(i * 1.3 + t) * 300;
    let py = cos(i * 2.1 + t) * 160 - 80;
    let pz = sin(i * 0.7 + t) * 200;
    push();
    translate(px, py, pz);
    sphere(2, 8, 8);
    pop();
  }
  pop();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

class Crystal {
  constructor() {
    this.x = random(-260, 260);
    this.y = random(-180, 80);
    this.z = random(-200, 200);
    this.h = random(60, 180);
    this.w = random(24, 60);
    this.d = random(24, 60);
    this.rotX = random(TWO_PI);
    this.rotY = random(TWO_PI);
    this.speed = random(0.2, 0.7);
    this.hue = random([190, 210, 260, 320]);
    this.dist = dist(this.x, this.y, this.z, 0, -50, 0);
  }

  update(t, orbit) {
    this.rotY += 0.003 * this.speed;
    this.y += sin(t * this.speed + this.dist * 0.01) * 0.25;
  }

  display() {
    push();
    translate(this.x, this.y, this.z);
    rotateX(this.rotX);
    rotateY(this.rotY);

    // glassy material
    fill(this.hue, 70, 85, 18);
    specularMaterial(255);
    shininess(100);
    metalness(40);
    box(this.w, this.h, this.d);

    // inner glow core
    push();
    scale(0.55);
    fill(this.hue, 90, 95, 45);
    box(this.w, this.h, this.d);
    pop();

    pop();
  }
}
</script>
</body>
</html>
