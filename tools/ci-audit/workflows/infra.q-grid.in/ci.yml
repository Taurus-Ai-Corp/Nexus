name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Verify bundle size
        run: |
          MAIN_SIZE=$(stat -c%s dist/public/assets/index-*.js 2>/dev/null || stat -f%z dist/public/assets/index-*.js)
          echo "Main bundle size: ${MAIN_SIZE} bytes"
          if [ "$MAIN_SIZE" -gt 500000 ]; then
            echo "::warning::Main bundle exceeds 500KB ($MAIN_SIZE bytes)"
          fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high || true

      - name: Check for secrets
        run: |
          if grep -rn "PRIVATE_KEY\|sk-\|sk_live\|password.*=" --include="*.ts" --include="*.tsx" --include="*.js" client/ server/ shared/ 2>/dev/null | grep -v "node_modules" | grep -v ".env"; then
            echo "::error::Potential hardcoded secrets found"
            exit 1
          fi
          echo "No hardcoded secrets detected"
