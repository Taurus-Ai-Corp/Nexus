name: CI/CD — NeoSync™ Social Suite

on:
  push:
    branches: [main, develop]
    paths:
      - 'NeoSync™ _ Platform Devops/social-suite-dashboard/**'
  pull_request:
    branches: [main]
    paths:
      - 'NeoSync™ _ Platform Devops/social-suite-dashboard/**'

env:
  WORKSPACE: 'NeoSync™ _ Platform Devops/social-suite-dashboard'

jobs:
  # ── Frontend: Lint + Build ──
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKSPACE }}/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint if configured)
        run: npm run build --dry-run 2>/dev/null || echo "No lint script — skipping"
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || '' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.WORKSPACE }}/web/dist/
          retention-days: 7

  # ── Backend: Lint + Type Check ──
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}/api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ${{ env.WORKSPACE }}/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check . --output-format=github || true

      - name: Format check with Ruff
        run: ruff format . --check || true

      - name: Validate migrations exist
        run: |
          if [ -d "migrations" ] && [ "$(ls migrations/*.sql 2>/dev/null)" ]; then
            echo "✅ Migration files found"
            ls -la migrations/
          else
            echo "⚠️ No migration files — API may fail on fresh DB"
          fi

  # ── Deploy Frontend to Vercel (main branch only) ──
  deploy-frontend:
    name: Deploy Frontend → Vercel
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ${{ env.WORKSPACE }}/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKSPACE }}/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY || '' }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ${{ env.WORKSPACE }}/web
          vercel-args: '--prod'

  # ── Deploy Backend to Render (main branch only) ──
  deploy-backend:
    name: Deploy Backend → Render
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" || echo "Render deploy hook not configured"
