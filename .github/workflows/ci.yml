name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  secrets-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-js:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx eslint social-suite-dashboard/web/src/ --max-warnings 0

  lint-py:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check 01-CORE-PLATFORM/nexus-backend/ --config 01-CORE-PLATFORM/nexus-backend/pyproject.toml --output-format github

  build-web:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: social-suite-dashboard/web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: social-suite-dashboard/web
      - run: npx vite build
        working-directory: social-suite-dashboard/web

  test-web:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: social-suite-dashboard/web/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: social-suite-dashboard/web
      - run: npx vitest run
        working-directory: social-suite-dashboard/web

  test-py:
    name: Test (Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest pytest-asyncio httpx
      - run: python3 -m pytest 01-CORE-PLATFORM/nexus-backend/tests/ -v
