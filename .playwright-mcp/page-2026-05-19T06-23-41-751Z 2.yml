  - generic [ref=e406]:
    - heading "Frequently Asked Questions about Vedaanta Lotus Retirement Community" [level=2] [ref=e407]
    - generic [ref=e408]:
      - paragraph [ref=e409]:
        - strong [ref=e410]: 1. Where is Vedaanta Lotus located?
      - paragraph [ref=e411]: Vedaanta Lotus is located on Chavakkad Road, Guruvayoor - 680 101, just 450 meters from the South Nada of Guruvayoor Temple.
    - generic [ref=e412]:
      - paragraph [ref=e413]:
        - strong [ref=e414]: 2. How far is Vedaanta Lotus from major transportation hubs?
      - paragraph [ref=e415]: Vedaanta Lotus is 600 meters from the bus stand, 1.5 kilometers from the railway station, and 80 kilometers from Cochin International Airport.
    - generic [ref=e416]:
      - paragraph [ref=e417]:
        - strong [ref=e418]: 3. What amenities are offered at Vedaanta Lotus?
      - paragraph [ref=e419]: Vedaanta Lotus offers a range of amenities including 24/7 healthcare, a yoga and meditation center, a gym and fitness area, a vegetarian café, concierge services, housekeeping, and round-the-clock security.
    - generic [ref=e420]:
      - paragraph [ref=e421]:
        - strong [ref=e422]: 4. What types of homes are available at Vedaanta Lotus?
      - paragraph [ref=e423]: Vedaanta Lotus offers studio apartments, one & two BHK houses designed to meet the lifestyle needs of seniors.
    - generic [ref=e424]:
      - paragraph [ref=e425]:
        - strong [ref=e426]: 5. Are there dining options available within the community?
      - paragraph [ref=e427]: Yes, there is a vegetarian café within the community offering a variety of nutritious delicacies prepared by our chefs.
    - generic [ref=e428]:
      - paragraph [ref=e429]:
        - strong [ref=e430]: 6. Is there a healthcare facility available on-site?
      - paragraph [ref=e431]: Yes, Vedaanta Lotus has an in-house medical center with a 24/7 paramedical team, including a nurse and physiotherapist, along with an ambulance service for emergencies.
    - generic [ref=e432]:
      - paragraph [ref=e433]:
        - strong [ref=e434]: 7. What are the nearby healthcare facilities?
      - paragraph [ref=e435]: Nearby healthcare facilities include an Ayurvedic Hospital (50 meters), Devaswom Hospital (700 meters), and Rajah Hospital (1.5 kilometers).
    - generic [ref=e436]:
      - paragraph [ref=e437]:
        - strong [ref=e438]: 8. What activities and social programs are available for residents?
      - paragraph [ref=e439]: Our community offers a range of activities including yoga, arts and crafts, music sessions, cultural events, and outings to local attractions.
    - generic [ref=e440]:
      - paragraph [ref=e441]:
        - strong [ref=e442]: 9. What security measures ensure residents' safety?
      - paragraph [ref=e443]: Our community has 24/7 security, CCTV surveillance, secure entry points, and emergency response systems in place.
    - generic [ref=e444]:
      - paragraph [ref=e445]:
        - strong [ref=e446]: 10. What is the status of the project? Is it ready to move in?
      - paragraph [ref=e447]: Vedaanta Lotus is currently under construction and is expected to be ready for move-in by March 2025.
    - generic [ref=e448]:
      - paragraph [ref=e449]:
        - strong [ref=e450]: 11. How can I contact Vedaanta Lotus for more information?
      - paragraph [ref=e451]: You can contact Vedaanta Lotus at +91 84477 98333 or email info@vedaanta.com for more information.
