# TAURUS AI CORP - World-Class Analytics Dashboard Configuration
# Powered by Motia Event-Driven Architecture

# Application Configuration
app:
  name: "TAURUS AI CORP Analytics Dashboard"
  version: "1.0.0"
  description: "World-class analytics dashboard powered by Motia and your 200+ AI agents"
  environment: "production"

# Motia Configuration
motia:
  # Event-driven architecture settings
  eventBus:
    type: "redis"
    host: "localhost"
    port: 6379
    password: ""
    db: 0
  
  # State management
  state:
    adapter: "redis"
    host: "localhost"
    port: 6379
    password: ""
    db: 1
    ttl: 3600
  
  # Real-time streaming
  streams:
    dashboard-updates:
      storageType: "redis"
      ttl: 1800
    agent-metrics:
      storageType: "redis"
      ttl: 3600
    system-alerts:
      storageType: "redis"
      ttl: 7200

# Server Configuration
server:
  host: "0.0.0.0"
  port: 3001
  cors:
    origin: ["http://localhost:3000", "https://taurusai.io"]
    credentials: true
  
  # WebSocket configuration
  websocket:
    enabled: true
    path: "/ws"
    heartbeat: 30

# Database Configuration
database:
  primary:
    type: "mongodb"
    uri: "mongodb://localhost:27017/taurus_analytics"
    options:
      useNewUrlParser: true
      useUnifiedTopology: true
  
  cache:
    type: "redis"
    host: "localhost"
    port: 6379
    db: 2

# Agent Integration Configuration
agents:
  # BizFlow Orchestrator Integration
  bizflow:
    enabled: true
    endpoint: "http://localhost:8000"
    apiKey: "${BIZFLOW_API_KEY}"
    
  # MCP Agents Integration
  mcp:
    enabled: true
    agents:
      - name: "webflow-design"
        type: "design"
        config:
          apiKey: "${WEBFLOW_API_KEY}"
      - name: "figma-mcp"
        type: "design"
        config:
          apiKey: "${FIGMA_API_KEY}"
      - name: "tailwind-mcp"
        type: "styling"
        config:
          enabled: true
      - name: "github-mcp"
        type: "development"
        config:
          token: "${GITHUB_TOKEN}"

# Analytics Configuration
analytics:
  # Data collection intervals
  collection:
    business_metrics: "30s"
    agent_performance: "60s"
    system_health: "10s"
    user_analytics: "5m"
  
  # Real-time updates
  realtime:
    enabled: true
    broadcast_interval: "5s"
    max_clients: 1000
  
  # Data retention
  retention:
    metrics: "30d"
    logs: "7d"
    alerts: "90d"

# Security Configuration
security:
  # JWT Configuration
  jwt:
    secret: "${JWT_SECRET}"
    expiresIn: "24h"
    refreshExpiresIn: "7d"
  
  # Rate limiting
  rateLimit:
    windowMs: 60000
    max: 100
    message: "Too many requests from this IP"
  
  # CORS
  cors:
    origin: true
    credentials: true
    methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
    allowedHeaders: ["Content-Type", "Authorization", "X-Requested-With"]

# Logging Configuration
logging:
  level: "info"
  format: "json"
  transports:
    - type: "console"
    - type: "file"
      filename: "logs/dashboard.log"
      maxsize: 10485760
      maxFiles: 5

# Monitoring Configuration
monitoring:
  # Health checks
  health:
    enabled: true
    interval: "30s"
    timeout: "5s"
  
  # Metrics collection
  metrics:
    enabled: true
    interval: "60s"
    exporters:
      - type: "prometheus"
        port: 9090
      - type: "console"
  
  # Alerting
  alerts:
    enabled: true
    channels:
      - type: "webhook"
        url: "${ALERT_WEBHOOK_URL}"
      - type: "email"
        smtp:
          host: "${SMTP_HOST}"
          port: 587
          user: "${SMTP_USER}"
          pass: "${SMTP_PASS}"

# Performance Configuration
performance:
  # Caching
  cache:
    enabled: true
    ttl: 300
    maxSize: 1000
  
  # Compression
  compression:
    enabled: true
    level: 6
  
  # Request timeout
  timeout:
    api: "30s"
    websocket: "60s"

# Development Configuration
development:
  hotReload: true
  debugMode: false
  mockData: false
  
# Production Configuration
production:
  hotReload: false
  debugMode: false
  mockData: false
  ssl:
    enabled: true
    cert: "/etc/ssl/certs/taurusai.io.crt"
    key: "/etc/ssl/private/taurusai.io.key"

