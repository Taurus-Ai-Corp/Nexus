[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["**/chat_with_code.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing lint debt inherited by the hyphen->underscore rename of these
# agent modules (2026-08-10). The rename made pre-commit lint them for the first
# time; none of it is new code. Suppressed to unblock the rename, NOT resolved.
# SECURITY-RELEVANT and still outstanding — track separately, do not just delete
# these ignores: S311 (non-crypto RNG), S324 (md5), S104 (bind 0.0.0.0).
"**/agents/specialized/*/agent.py" = ["B007", "B904", "E501", "F841", "S104", "S311", "S324"]
"**/backend/tests/*.py" = ["S101"]
"backend/auth.py" = ["S105"]
# main.py carried 35 ruff errors at HEAD and predates the pre-commit ruff hook,
# so it has never passed. Suppressed as inherited debt, NOT fixed. E402 is
# structural (the imports must follow the sys.path mutation). B008 is the normal
# FastAPI Depends() idiom. Still outstanding and worth a dedicated pass:
# E722 bare except, S110 try-except-pass, F841 unused, S104 dev-server bind.
#
# !! F811 here is a REAL SECURITY FINDING, not style. main.py imports
#    create_access_token / verify_token / hash_password / verify_password from
#    auth.py (lines 25-29) and then REDEFINES all four (lines 388-426). The local
#    definitions win, so auth.py's versions are dead. Consequences:
#      * tokens live 24h instead of ACCESS_TOKEN_EXPIRE_MINUTES = 15 (96x longer)
#      * the `type == "access_token"` claim check is skipped, so any JWT signed
#        with the same secret is accepted by the 9 endpoints using verify_token
#    Deleting the four duplicates restores auth.py's behaviour, but that shortens
#    live sessions and starts rejecting type-less tokens — a deliberate rollout,
#    not a lint fix. Ignored to unblock the commit; MUST be resolved separately.
"**/backend/main.py" = ["S105", "B904", "E402", "E722", "E501", "S110", "N806",
                        "N805", "S104", "F841", "B008", "F811"]
"agents/integrations/mcp-agents/oauth_token_discovery.py" = ["S105"]
"agents/integrations/mcp-agents/test_basic.py" = ["S105"]
"agents/integrations/mcp-agents/design-ai-mcp/design_ai_mcp.py" = ["S105"]
"subdomains/bizflow.taurusai.io/agents/integrations/mcp-agents/design-ai-mcp/design_ai_mcp.py" = ["S105"]
"subdomains/bizflow.taurusai.io/agents/integrations/mcp-agents/external-mcps/klavis/mcp-clients/src/mcp_clients/slack/oauth_routes.py" = ["S105"]
"08-shared/Configuration/cursor/.claude/awesome-AI-Apps/demo-github-mcp.py" = ["S105"]

# One-shot CI-audit tooling (tools/ci-audit/): throwaway scripts that shell out
# to `gh`/`git` with compact one-liners. Exempt from rules that flag legitimate
# throwaway-script patterns (subprocess shell=True, long lines, one-line
# conditionals, bare-except, ambiguous `l`). Not Nexus product code.
"tools/ci-audit/*.py" = ["S603", "S607", "S110", "E501", "E701", "E741"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

