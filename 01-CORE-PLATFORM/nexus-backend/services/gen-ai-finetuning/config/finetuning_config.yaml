# ===========================================
# Gen AI Fine-Tuning Configuration
# ===========================================
# Central configuration for all fine-tuning jobs
# Supports Claude (Anthropic API) and local Ollama models

# ===========================================
# Claude Fine-Tuning Configuration
# ===========================================

claude:
  # Base models available for fine-tuning
  base_models:
    - name: "claude-3-haiku-20240307"
      description: "Fast, cost-effective model"
      max_training_examples: 10000
      cost_per_1k_examples: 0.80  # USD
    
    - name: "claude-3-sonnet-20240229"
      description: "Balanced performance and cost"
      max_training_examples: 10000
      cost_per_1k_examples: 3.00  # USD
    
    - name: "claude-3-opus-20240229"
      description: "Highest quality, most expensive"
      max_training_examples: 10000
      cost_per_1k_examples: 15.00  # USD
  
  # Default training parameters
  default_params:
    hyperparameters:
      learning_rate_multiplier: 1.0
      batch_size: 4
      n_epochs: 1
    
    # Dataset requirements
    min_examples: 10
    max_examples: 10000
    validation_split: 0.1
    
    # Format requirements
    format: "jsonl"
    required_fields:
      - "messages"
      - "system"  # Optional
    
    # Message format
    message_format:
      roles: ["user", "assistant"]
      alternating: true
      first_role: "user"
      last_role: "assistant"
  
  # API Configuration
  api:
    base_url: "https://api.anthropic.com"
    endpoints:
      create_job: "/v1/fine_tuning/jobs"
      get_job: "/v1/fine_tuning/jobs/{job_id}"
      list_jobs: "/v1/fine_tuning/jobs"
      cancel_job: "/v1/fine_tuning/jobs/{job_id}/cancel"
    
    # Rate limits
    rate_limits:
      requests_per_minute: 10
      requests_per_hour: 100
  
  # Cost estimation
  cost_estimation:
    # Per 1K training examples
    training_cost_per_1k:
      haiku: 0.80
      sonnet: 3.00
      opus: 15.00
    
    # Inference costs (per 1M tokens)
    inference_cost_per_1m_tokens:
      haiku:
        input: 0.25
        output: 1.25
      sonnet:
        input: 3.00
        output: 15.00
      opus:
        input: 15.00
        output: 75.00

# ===========================================
# Local Ollama Fine-Tuning Configuration
# ===========================================

ollama:
  # Supported models for fine-tuning
  supported_models:
    - name: "llama3.1:8b"
      description: "General purpose, 8B parameters"
      context_window: 8192
      fine_tuning_method: "lora"
      lora_rank: 16
      lora_alpha: 32
    
    - name: "codellama:13b"
      description: "Code-focused, 13B parameters"
      context_window: 4096
      fine_tuning_method: "lora"
      lora_rank: 16
      lora_alpha: 32
    
    - name: "mistral:7b"
      description: "Fast, efficient, 7B parameters"
      context_window: 8192
      fine_tuning_method: "lora"
      lora_rank: 8
      lora_alpha: 16
  
  # LoRA Configuration
  lora:
    default_rank: 16
    default_alpha: 32
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    dropout: 0.05
    bias: "none"
  
  # Training parameters
  training:
    batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 2e-4
    num_epochs: 3
    warmup_steps: 100
    save_steps: 500
    eval_steps: 500
    logging_steps: 100
  
  # Hardware requirements
  hardware:
    min_gpu_memory: "8GB"
    recommended_gpu_memory: "16GB"
    supported_gpus:
      - "NVIDIA A100"
      - "NVIDIA V100"
      - "NVIDIA RTX 3090"
      - "NVIDIA RTX 4090"
  
  # Model quantization (for deployment)
  quantization:
    methods:
      - "q4_0"  # 4-bit quantization
      - "q8_0"  # 8-bit quantization
    default: "q4_0"

# ===========================================
# Dataset Configuration
# ===========================================

dataset:
  # Supported sources
  sources:
    - name: "agent_conversations"
      description: "Extract from agent conversation logs"
      format: "jsonl"
      required_fields: ["messages", "timestamp", "agent_id"]
    
    - name: "memory_mcp"
      description: "Extract from Memory MCP knowledge graph"
      format: "jsonl"
      required_fields: ["messages", "context", "knowledge_id"]
    
    - name: "code_examples"
      description: "Code examples and explanations"
      format: "jsonl"
      required_fields: ["messages", "code", "language"]
    
    - name: "domain_specific"
      description: "Domain-specific training data"
      format: "jsonl"
      required_fields: ["messages", "domain", "category"]
  
  # Data quality filters
  quality_filters:
    min_message_length: 10
    max_message_length: 10000
    min_conversation_turns: 2
    max_conversation_turns: 50
    required_alternating_roles: true
    filter_empty_messages: true
    filter_duplicate_conversations: true
  
  # Data augmentation
  augmentation:
    enabled: false
    methods:
      - "paraphrasing"
      - "back_translation"
      - "synonym_replacement"
    augmentation_ratio: 0.2  # 20% of data augmented
  
  # Validation
  validation:
    required_fields_check: true
    format_validation: true
    message_structure_check: true
    role_alternation_check: true

# ===========================================
# Training Job Configuration
# ===========================================

training_job:
  # Job status tracking
  statuses:
    - "pending"
    - "running"
    - "completed"
    - "failed"
    - "cancelled"
  
  # Retry configuration
  retry:
    max_retries: 3
    retry_delay_seconds: 60
    exponential_backoff: true
  
  # Monitoring
  monitoring:
    check_interval_seconds: 30
    log_level: "INFO"
    save_checkpoints: true
    checkpoint_interval: 1000  # steps
  
  # Notification
  notifications:
    on_completion: true
    on_failure: true
    on_cancellation: true
    channels:
      - "email"
      - "slack"
      - "webhook"

# ===========================================
# Model Registry Configuration
# ===========================================

model_registry:
  # Storage
  storage:
    type: "local"  # or "s3", "gcs"
    base_path: "./deployment/models"
    version_format: "v{version}_{timestamp}"
  
  # Versioning
  versioning:
    scheme: "semantic"  # major.minor.patch
    auto_increment: true
    keep_versions: 10  # Keep last 10 versions
  
  # Metadata
  metadata_fields:
    - "model_name"
    - "base_model"
    - "training_date"
    - "training_examples"
    - "performance_metrics"
    - "deployment_status"
  
  # Deployment
  deployment:
    auto_deploy: false
    deployment_stages:
      - "staging"
      - "production"
    health_check_enabled: true

# ===========================================
# Integration Configuration
# ===========================================

integration:
  # LocalAIRouter integration
  local_ai_router:
    enabled: true
    priority: "fine_tuned"  # Prefer fine-tuned models
    fallback_to_base: true
  
  # Agent orchestrator integration
  agent_orchestrator:
    enabled: true
    auto_register: true
    route_to_fine_tuned: true
  
  # API endpoints
  api:
    enabled: true
    port: 8001
    endpoints:
      - "/api/v1/finetuning/jobs"
      - "/api/v1/finetuning/models"
      - "/api/v1/finetuning/datasets"

# ===========================================
# Environment Variables
# ===========================================

environment:
  required:
    - "ANTHROPIC_API_KEY"  # For Claude fine-tuning
    - "OLLAMA_URL"  # For local fine-tuning (default: http://localhost:11434)
  
  optional:
    - "OPENAI_API_KEY"  # For evaluation/comparison
    - "SLACK_WEBHOOK_URL"  # For notifications
    - "EMAIL_SMTP_SERVER"  # For email notifications


