# ===========================================
# BizFlow Backend - Production Stack
# Docker Compose for PostgreSQL + Redis
# ===========================================

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bizflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bizflow
      POSTGRES_USER: ${POSTGRES_USER:-bizflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bizflow_user} -d bizflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bizflow-network

  # Redis Cache + Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: bizflow-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-change_me_in_production} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me_in_production}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bizflow-network

  # PgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bizflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@taurusai.io
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change_me_in_production}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - bizflow-network
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  bizflow-network:
    driver: bridge

# ===========================================
# USAGE:
#
# 1. Create .env from .env.example and fill in passwords
# 2. Run: docker-compose up -d
# 3. Get PostgreSQL connection string:
#    postgresql://bizflow_user:password@localhost:5432/bizflow
# 4. Get Redis URL:
#    redis://:password@localhost:6379/0
#
# TO START WITH PGADMIN:
#    docker-compose --profile admin up -d
#
# TO STOP:
#    docker-compose down
#
# TO STOP AND REMOVE DATA:
#    docker-compose down -v
# ===========================================
