# Agentuity MCP Integration Configuration
# Vibe Marketing Empire - MCP Server Integration

project:
  name: "vibe-marketing-empire"
  version: "1.0.0"
  description: "AI-powered marketing automation with MCP integration"

mcp_servers:
  # Design & Creative Tools
  figma:
    enabled: true
    path: "/Users/user/Documents/TAURUS AI Corp./CURSOR Projects/BizFlow-Vibe-Marketing-Ecosystem/mcp-agents/figma-mcp/index.js"
    environment:
      FIGMA_ACCESS_TOKEN: "${FIGMA_ACCESS_TOKEN}"
    agent_integrations:
      - "content-creation-agent"
      - "brand-adaptation-agent"
    use_cases:
      - "Design asset generation"
      - "Brand template creation"
      - "Visual content automation"
      - "Client brand adaptation"

  design_tokens:
    enabled: true
    path: "/Users/user/Documents/TAURUS AI Corp./CURSOR Projects/BizFlow-Vibe-Marketing-Ecosystem/mcp-agents/design-tokens-mcp/index.js"
    environment:
      DESIGN_TOKENS_PATH: "/Users/user/Documents/TAURUS AI Corp./CURSOR Projects/BizFlow-Vibe-Marketing-Ecosystem/mcp-agents/design-tokens-mcp/tokens"
    agent_integrations:
      - "all-agents"
    use_cases:
      - "Brand consistency enforcement"
      - "Visual identity management"
      - "Design system automation"
      - "Multi-brand adaptation"

  tailwind:
    enabled: true
    path: "/Users/user/Documents/TAURUS AI Corp./CURSOR Projects/BizFlow-Vibe-Marketing-Ecosystem/mcp-agents/tailwind-mcp/index.js"
    agent_integrations:
      - "content-creation-agent"
      - "web-development-agent"
    use_cases:
      - "Responsive design generation"
      - "CSS utility automation"
      - "Component styling"
      - "Mobile optimization"

  components:
    enabled: true
    path: "/Users/user/Documents/TAURUS AI Corp./CURSOR Projects/BizFlow-Vibe-Marketing-Ecosystem/mcp-agents/component-library-mcp/index.js"
    agent_integrations:
      - "content-creation-agent"
      - "ui-automation-agent"
    use_cases:
      - "Reusable component management"
      - "UI template generation"
      - "Design system components"
      - "Client-specific adaptations"

  icons:
    enabled: true
    path: "/Users/user/Documents/TAURUS AI Corp./CURSOR Projects/BizFlow-Vibe-Marketing-Ecosystem/mcp-agents/icon-assets-mcp/index.js"
    agent_integrations:
      - "content-creation-agent"
      - "brand-adaptation-agent"
    use_cases:
      - "Icon asset management"
      - "Visual element automation"
      - "Brand icon generation"
      - "Multi-platform optimization"

  website_downloader:
    enabled: true
    path: "/path/to/website-downloader/build/index.js"
    agent_integrations:
      - "cultural-intelligence-agent"
      - "competitor-analysis-agent"
    use_cases:
      - "Market research automation"
      - "Competitor analysis"
      - "Content inspiration"
      - "Cultural trend monitoring"

# Agent Definitions
agents:
  cultural_intelligence_agent:
    name: "Cultural Intelligence Agent"
    description: "Market research & cultural analysis for Dubai/India markets"
    mcp_dependencies:
      - "website_downloader"
      - "design_tokens"
    capabilities:
      - "Market trend analysis"
      - "Cultural adaptation insights"
      - "Competitor benchmarking"
      - "Local market intelligence"
    revenue_impact: "$150K Q1 target"

  content_creation_agent:
    name: "Content Creation Agent"
    description: "Automated content generation for campaigns"
    mcp_dependencies:
      - "figma"
      - "design_tokens"
      - "tailwind"
      - "components"
      - "icons"
    capabilities:
      - "Visual asset generation"
      - "Brand adaptation"
      - "Multi-channel content"
      - "Cultural customization"
    revenue_impact: "$300K Q2 target"

  campaign_optimization_agent:
    name: "Campaign Optimization Agent"
    description: "Real-time campaign performance optimization"
    mcp_dependencies:
      - "design_tokens"
      - "components"
    capabilities:
      - "Performance monitoring"
      - "A/B testing automation"
      - "ROI optimization"
      - "Conversion tracking"
    revenue_impact: "$500K Q3 target"

  lead_generation_agent:
    name: "Lead Generation Agent"
    description: "Lead scoring, nurturing, and conversion"
    mcp_dependencies:
      - "website_downloader"
      - "design_tokens"
    capabilities:
      - "Lead qualification"
      - "Nurturing automation"
      - "Conversion optimization"
      - "Pipeline management"
    revenue_impact: "$750K Q4 target"

  client_communication_agent:
    name: "Client Communication Agent"
    description: "Client relationship management & reporting"
    mcp_dependencies:
      - "figma"
      - "design_tokens"
      - "components"
    capabilities:
      - "Automated reporting"
      - "Client updates"
      - "Performance dashboards"
      - "Relationship management"
    revenue_impact: "Client retention & expansion"

# Workflow Definitions
workflows:
  campaign_launch_30day:
    name: "30-Day Campaign Launch Workflow"
    agents_sequence:
      - "cultural_intelligence_agent"
      - "content_creation_agent"
      - "campaign_optimization_agent"
      - "lead_generation_agent"
      - "client_communication_agent"
    mcp_integrations:
      - "All MCP servers"
    expected_roi: "574% (based on Swiss watch case study)"

  client_onboarding:
    name: "Client Onboarding Workflow"
    agents_sequence:
      - "cultural_intelligence_agent"
      - "content_creation_agent"
      - "client_communication_agent"
    mcp_integrations:
      - "figma"
      - "design_tokens"
      - "components"
    expected_roi: "340% client LTV increase"

# Performance Metrics
performance_targets:
  engagement_rate: "8.7% (vs 3.2% industry average)"
  cost_per_lead: "$59 (vs $127 industry average)"
  conversion_rate: "23% (vs 8% industry average)"
  roi_target: "574% return on investment"
  client_ltv_increase: "340%"

# Integration Benefits
integration_benefits:
  - "80% reduction in manual tasks"
  - "15+ clients handled simultaneously"
  - "Real-time cultural intelligence"
  - "Automated performance tracking"
  - "Scalable operations"
  - "Consistent brand management"
