global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'neosync-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'neosync-postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'neosync-qdrant'
    static_configs:
      - targets: ['qdrant:6333']

  - job_name: 'neosync-valkey'
    static_configs:
      - targets: ['valkey:6379']

  - job_name: 'neosync-meilisearch'
    static_configs:
      - targets: ['meilisearch:7700']

  - job_name: 'neosync-ollama'
    static_configs:
      - targets: ['ollama:11434']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
