# Nexus Platform — Unified Docker Compose
# TAURUS AI Corp. | Open-Source First
# Phase 1: Foundation Stack
#
# SECURITY: All secrets MUST be set in .env (never use defaults in production).
# Run: python3 -c "import secrets; print(secrets.token_urlsafe(48))" to generate secrets.
# The defaults below are INSECURE placeholders for local development only.
#
# PRODUCTION NOTES:
# - Internal service ports (postgres, qdrant, valkey, meilisearch) are NOT exposed to the host.
#   Only api (8000), web (3000), grafana (3001), and prometheus (9090) are exposed.
# - All images are pinned to specific versions. Update versions intentionally, never use :latest.
# - Resource limits should be added for production (see SECURITY_REMEDIATION_PLAN.md).

services:
  # ── DATABASES ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql
    # SECURITY: Port NOT exposed to host — only accessible via nexus-net
    # For local dev only, uncomment: ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-net

  qdrant:
    image: qdrant/qdrant:v1.13.4
    container_name: nexus-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      # SECURITY: gRPC port (6334) NOT exposed — only REST API needed
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-net

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: nexus-valkey
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    # SECURITY: Port NOT exposed to host — only accessible via nexus-net
    # For local dev only, uncomment: ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-net

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    container_name: nexus-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY must be set in .env}
      MEILI_ENV: ${MEILI_ENV:-production}
    volumes:
      - meili_data:/meili_data
    # SECURITY: Port NOT exposed to host — only accessible via nexus-net
    # For local dev only, uncomment: ports: ["7700:7700"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-net

  # ── AI SERVICES ──
  # Ollama runs natively on host (port 11434 already in use)
  # API connects via host.docker.internal:11434

  hf-mcp:
    image: ghcr.io/huggingface/mcp-server:0.6.2
    container_name: nexus-hf-mcp
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HUGGINGFACE_API_KEY}
      HF_MODEL_ID: ${HUGGINGFACE_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
    # SECURITY: Port NOT exposed to host — only accessible via nexus-net
    # For local dev only, uncomment: ports: ["8002:8000"]
    networks:
      - nexus-net

  # ── APPLICATION ──
  api:
    build:
      context: ./social-suite-dashboard/api
      dockerfile: Dockerfile
    container_name: nexus-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nexus}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - REDIS_URL=valkey://valkey:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=hermes-4-14b
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - HUGGINGFACE_MODEL=${HUGGINGFACE_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-30}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - IG_ACCESS_TOKEN=${IG_ACCESS_TOKEN}
      - IG_BUSINESS_ACCOUNT_ID=${IG_BUSINESS_ACCOUNT_ID}
      - NEXUS_API_URL=${NEXUS_API_URL:-http://nexus-backend:4000}
      - NEXUS_API_KEY=${NEXUS_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://nexus-social.vercel.app}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - ./social-suite-dashboard/api:/app
      - api_uploads:/app/uploads
    networks:
      - nexus-net

  web:
    build:
      context: ./social-suite-dashboard/web
      dockerfile: Dockerfile
    container_name: nexus-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_NLP_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./social-suite-dashboard/web:/app
      - /app/node_modules
    networks:
      - nexus-net

  # ── MONITORING ──
  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: nexus-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - nexus-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: nexus-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - nexus-net

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  valkey_data:
    driver: local
  meili_data:
    driver: local
  ollama_models:
    driver: local
  api_uploads:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  nexus-net:
    driver: bridge