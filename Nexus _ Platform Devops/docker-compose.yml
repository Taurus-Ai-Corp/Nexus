# NeoSync™ — Unified Docker Compose
# TAURUS AI CORP - FZCO | Open-Source First
# Phase 1: Foundation Stack

services:
  # ── DATABASES ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: neosync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neosync}
      POSTGRES_USER: ${POSTGRES_USER:-neosync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neosync_secure_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neosync}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neosync-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: neosync-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neosync-net

  valkey:
    image: valkey/valkey:7-alpine
    container_name: neosync-valkey
    restart: unless-stopped
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neosync-net

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: neosync-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-neosync_master_key_change_me}
      MEILI_ENV: ${MEILI_ENV:-development}
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neosync-net

  # ── AI SERVICES ──
  # Ollama runs natively on host (port 11434 already in use)
  # API connects via host.docker.internal:11434
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: neosync-ollama
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   ports:
  #     - "11434:11434"

  hf-mcp:
    image: ghcr.io/huggingface/mcp-server:latest
    container_name: neosync-hf-mcp
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HUGGINGFACE_API_KEY}
      HF_MODEL_ID: ${HUGGINGFACE_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
    ports:
      - "8002:8000"
    networks:
      - neosync-net

  # ── APPLICATION ──
  api:
    build:
      context: ./social-suite-dashboard/api
      dockerfile: Dockerfile
    container_name: neosync-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-neosync}:${POSTGRES_PASSWORD:-neosync_secure_2026}@postgres:5432/${POSTGRES_DB:-neosync}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-}
      - REDIS_URL=valkey://valkey:6379/0
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_KEY=${MEILI_MASTER_KEY:-neosync_master_key_change_me}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=hermes-4-14b
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - HUGGINGFACE_MODEL=${HUGGINGFACE_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      - JWT_SECRET=${JWT_SECRET:-neosync_jwt_secret_change_in_production}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_EXPIRE_MINUTES=${JWT_EXPIRE_MINUTES:-30}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - IG_ACCESS_TOKEN=${IG_ACCESS_TOKEN}
      - IG_BUSINESS_ACCOUNT_ID=${IG_BUSINESS_ACCOUNT_ID}
      - BIZFLOW_API_URL=${BIZFLOW_API_URL:-http://bizflow-backend:4000}
      - BIZFLOW_API_KEY=${BIZFLOW_API_KEY}
      - NEOVIBE_API_URL=${NEOVIBE_API_URL:-http://neovibe-core:3001}
      - NEOVIBE_API_KEY=${NEOVIBE_API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    volumes:
      - ./social-suite-dashboard/api:/app
      - api_uploads:/app/uploads
    networks:
      - neosync-net

  web:
    build:
      context: ./social-suite-dashboard/web
      dockerfile: Dockerfile
    container_name: neosync-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_NLP_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./social-suite-dashboard/web:/app
      - /app/node_modules
    networks:
      - neosync-net

  # ── MONITORING ──
  grafana:
    image: grafana/grafana-oss:latest
    container_name: neosync-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - neosync-net

  prometheus:
    image: prom/prometheus:latest
    container_name: neosync-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - neosync-net

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  valkey_data:
    driver: local
  meili_data:
    driver: local
  ollama_models:
    driver: local
  api_uploads:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  neosync-net:
    driver: bridge
