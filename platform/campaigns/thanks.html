  <style>
    /* Colour, type and chrome come from ../assets/css/tokens.css (generated from
       platform/lib/tokens.mjs). This page previously carried its own palette and
       type stack -- DM Serif Display / Plus Jakarta Sans on #F6F4EF -- which is
       exactly the second copy Convergence Analysis E2 warns about. Only the
       local ALIASES this page's markup already references remain below; they
       point at canonical tokens rather than restating any value. */
    :root {
      --ink: var(--text);
      --ink-muted: var(--text-muted);
      --font-body: var(--font-sans);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font-body); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
    .container { max-width: 720px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 3rem); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
    h1 { font-family: var(--font-display); font-size: clamp(2.4rem, 6vw, 3.6rem); margin: 0 0 1.2rem; font-weight: 400; letter-spacing: -0.02em; line-height: 1; }
    p { line-height: 1.7; color: var(--ink-muted); margin: 0 0 1.6rem; }
    .mono { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--accent); margin-bottom: 1rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 1.2rem; padding: clamp(2rem, 5vw, 3rem); }
    label { display: block; margin-bottom: 0.5rem; font-size: 0.8rem; font-weight: 600; }
    input, textarea { width: 100%; padding: 1rem; border: 1.5px solid var(--border); border-radius: 0.8rem; background: var(--bg); font-family: var(--font-body); font-size: 0.95rem; margin-bottom: 1rem; outline: none; }
    input:focus, textarea:focus { border-color: var(--accent); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 0.9rem 1.6rem; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 0.85rem; font-weight: 600; border: 1.5px solid var(--ink); text-decoration: none; cursor: pointer; width: 100%; }
    .btn:hover { background: var(--accent); border-color: var(--accent); }
    footer { text-align: center; font-size: 0.8rem; color: var(--ink-muted); margin-top: 2rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="mono">Nexus Creative</div>
      <h1>Welcome aboard.</h1>
      <p>Your payment is confirmed. To start your first campaign, send us your product or property brief. We will return a production-ready image prompt, headline options, and platform plan within one business day.</p>

      <form id="brief-form" action="#" method="post">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required placeholder="Your name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@company.com">

        <label for="company">Company / brand</label>
        <input type="text" id="company" name="company" placeholder="Acme Dubai">

        <label for="brief">Your brief</label>
        <textarea id="brief" name="brief" rows="6" required placeholder="Describe your product, target audience, and the mood you want. Example: 'Luxury sunscreen for women 30-45, summer campaign, Mediterranean yacht setting, golden hour.'"></textarea>

        <button type="submit" class="btn" onclick="event.preventDefault();submitBrief();if(typeof gtag==='function'){gtag('event','conversion',{send_to:'AW-18242669881/XVbiCOTP978cELma5PpD',value:1.0,currency:'CAD'});gtag('event','lead_brief_submit',{event_category:'nexus_creative'});}">Send brief →</button>
      </form>
      <p id="form-status" style="margin-top:1rem;font-size:0.8rem;color:var(--ink-muted);"></p>
    </div>
    <footer>© 2026 Taurus AI Corp. · nexus@taurusai.io</footer>
  </div>
  <script>
    // Track purchase conversion from URL plan parameter
    (function(){
      var params = new URLSearchParams(window.location.search);
      var plan = params.get('plan') || 'unknown';
      var values = {
        starter: 99.0, studio: 399.0,
        agency_starter: 399.0, agency_pro: 999.0,
        agency_enterprise: 2499.0, worldcup: 2500.0
      };
      var value = values[plan] || 0;
      if(value > 0 && typeof gtag === 'function'){
        gtag('event', 'conversion', {
          send_to: 'AW-18242669881',
          value: value,
          currency: 'USD',
          transaction_id: params.get('session_id') || ('nexus_' + Date.now())
        });
        gtag('event', 'purchase_' + plan, {
          event_category: 'nexus_creative',
          value: value,
          currency: 'USD'
        });
      }
      if(value > 0 && typeof fbq === 'function'){
        fbq('track', 'Purchase', {value: value, currency: 'USD'});
      }
      if(value > 0 && typeof window.lintrk === 'function'){
        window.lintrk('track', {conversion_id: value});
      }
      // Update heading based on plan
      var planLabels = {
        starter: 'Starter', studio: 'Studio',
        agency_starter: 'Agency Starter', agency_pro: 'Agency Pro',
        agency_enterprise: 'Agency Enterprise', worldcup: 'World Cup Neural Pack'
      };
      var label = planLabels[plan];
      if(label) document.querySelector('h1').textContent = label + ' — welcome aboard.';
    })();

    async function submitBrief() {
      var name = document.getElementById('name').value.trim();
      var email = document.getElementById('email').value.trim();
      var company = document.getElementById('company').value.trim();
      var brief = document.getElementById('brief').value.trim();
      var statusEl = document.getElementById('form-status');

      if (!name || !email || !brief) {
        statusEl.textContent = 'Please fill all required fields.';
        statusEl.style.color = 'var(--danger)';
        return;
      }

      statusEl.textContent = 'Submitting...';
      statusEl.style.color = 'var(--ink-muted)';

      try {
        var res = await fetch('/api/leads', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: email,
            source: 'post_purchase_brief',
            brief: brief,
            neural_score: null,
            platform: 'web',
            campaign_headline: '',
            name: name,
            company: company,
            plan: new URLSearchParams(window.location.search).get('plan') || 'unknown',
          })
        });
        var data = await res.json();
        if (res.ok) {
          statusEl.textContent = 'Brief received. Our team will contact you within 1 business day.';
          statusEl.style.color = 'var(--success-text)';
          document.getElementById('brief-form').reset();
        } else {
          statusEl.textContent = 'Error: ' + (data.error || 'Submission failed');
          statusEl.style.color = 'var(--danger)';
        }
      } catch (err) {
        statusEl.textContent = 'Network error. Please email nexus@taurusai.io directly.';
        statusEl.style.color = 'var(--danger)';
      }
    }
  </script>
</body>
</html>
