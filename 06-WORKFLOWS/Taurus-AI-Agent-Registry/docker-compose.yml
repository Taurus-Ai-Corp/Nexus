version: '3.8'

services:
  # 🤖 Ollama - Local AI Models
  ollama:
    image: ollama/ollama:latest
    container_name: taurus-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      - OLLAMA_ORIGINS=*
    networks:
      - ai-empire

  # 🏰 Taurus AI Registry - Agent Orchestrator
  taurus-registry:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: taurus-registry
    ports:
      - "8000:8000"
    environment:
      - MODE=local
      - OLLAMA_URL=http://ollama:11434
      - SUPABASE_URL=http://supabase-db:54322
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
    volumes:
      - ./agents:/app/agents
      - ./configs:/app/configs
      - ./registry:/app/registry
      - ./connectors:/app/connectors
    depends_on:
      - ollama
      - supabase-db
    restart: unless-stopped
    networks:
      - ai-empire

  # 🗄️ Supabase Database - Local Data Storage
  supabase-db:
    image: postgres:15
    container_name: taurus-supabase-db
    ports:
      - "54322:5432"
    environment:
      POSTGRES_DB: taurus_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your-super-secret-jwt-token-with-at-least-32-characters-long
    volumes:
      - supabase_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - ai-empire

  # 🔍 ChromaDB - Vector Database for Embeddings
  chromadb:
    image: chromadb/chroma:latest
    container_name: taurus-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    networks:
      - ai-empire

  # ⚡ Redis - Fast Caching Layer
  redis:
    image: redis:7-alpine
    container_name: taurus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - ai-empire

  # 📊 Grafana - Monitoring Dashboard (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: taurus-monitoring
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - ai-empire
    profiles:
      - monitoring

volumes:
  ollama_data:
    driver: local
  supabase_data:
    driver: local
  chroma_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local

networks:
  ai-empire:
    driver: bridge