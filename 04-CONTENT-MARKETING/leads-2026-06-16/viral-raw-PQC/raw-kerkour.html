	  window.__markdown_ninja_data = {"country":"CA","website":{"url":"https://kerkour.com","name":"Sylvain Kerkour","description":"(Ab)using technology for fun \u0026 profit.","navigation":{"primary":[{"label":"Home","url":"/"},{"label":"Blog","url":"/blog"},{"label":"Books","url":"/books"},{"label":"Black Hat Rust","url":"/black-hat-rust"}],"secondary":[]},"language":"en","ad":"\u003ca href=\"https://kerkour.com/black-hat-rust\" target=\"_blank\" style=\"text-decoration: none;\"\u003e\n  \u003cdiv style=\"padding: 2.5rem; margin-top: 1rem; margin-bottom: 1rem;  margin-top: 1.25rem; border-radius: 0.375rem; max-width: 48rem; text-align: center; color: #000000; background: #faf6c9;\"\u003e\n    \u003cimg src=\"https://kerkour.com/assets/books/black-hat-rust/black_hat_rust_cover.svg\"\n      alt=\"Black Hat Rust cover\" height=\"200\"\n      style=\"height: 200px; margin-bottom: 1rem; border-radius: 0.375rem;\"\n    /\u003e\n    \u003cp\u003e\n     Want to learn Rust, offensive security and applied cryptography?\n      Take a look at my book \u003cb\u003eBlack Hat Rust\u003c/b\u003e where, from theory to practice, you will build an end-to-end encryption protocol, exploits, a Remote Access Tool, craft shellcodes and many other things to get your hands dirty. \u003cbr /\u003e\n  \u003cspan style=\"color: red;\" data-mdninja-country-hide=\"US\"\u003eSpecial Promotion: \u003cs\u003e50 €\u003c/s\u003e 25 €\u003c/span\u003e\n  \u003cspan style=\"color: red;\" data-mdninja-country-show=\"US\"\u003eSpecial Promotion: \u003cs\u003e$50\u003c/s\u003e $25\u003c/span\u003e\n  \u003cbr /\u003e\n  \u003cspan data-countdown=\"2026-06-14T23:59:59.000Z\" style=\"color: red;\"\u003e\u003c/span\u003e\n    \u003c/p\u003e\n  \u003c/div\u003e\n\u003c/a\u003e","announcement":"Invest in yourself! \u003ca href=\"https://kerkour.com/black-hat-rust\" class=\"underline\"\u003e50% off Black Hat Rust\u003c/a\u003e \u003cspan data-countdown=\"2026-06-14T23:59:59.000Z\"\u003e\u003c/span\u003e","colors":{"background":"#ffffff","text":"#000000","accent":"#ff0000"},"logo":"/assets/pirate_flag_256.png","powered_by":true,"theme":"blog"},"page":{"date":"2026-04-22T06:00:00Z","modified_at":"2026-06-16T08:06:00Z","type":"post","title":"Cryptographic Right Answers: Post Quantum Edition","url":"https://kerkour.com/post-quantum-cryptography-recommendations-rust","path":"/post-quantum-cryptography-recommendations-rust","description":"There recently has been a lot of noise about quantum computing breakthroughs recently after Google\u0026#39;s articles Quantum frontiers may be closer than they appear and Safeguarding cryptocurrency by disclosing quantum","language":"en","body_hash":"4a135ebc2283f4a8f04deabedc497f1587e741a005bba6b727a58a937b267203","metadata_hash":"9532105a3edba616e74c99976623612294999655176f8bc95097b71816f24110","tags":[{"name":"cryptography","description":""},{"name":"post-quantum","description":""},{"name":"programming","description":""},{"name":"rust","description":""},{"name":"security","description":""}],"body":"\u003cp\u003eThere recently has been a lot of noise about quantum computing breakthroughs after Google's articles \u003ca href=\"https://blog.google/innovation-and-ai/technology/safety-security/cryptography-migration-timeline/\"\u003e\u003cem\u003eQuantum frontiers may be closer than they appear\u003c/em\u003e\u003c/a\u003e and \u003ca href=\"https://research.google/blog/safeguarding-cryptocurrency-by-disclosing-quantum-vulnerabilities-responsibly/\"\u003e\u003cem\u003eSafeguarding cryptocurrency by disclosing quantum vulnerabilities responsibly\u003c/em\u003e\u003c/a\u003e, followed by \u003ca href=\"https://blog.cloudflare.com/post-quantum-roadmap/\"\u003eCloudflare\u003c/a\u003e and \u003ca href=\"https://engineering.fb.com/2026/04/16/security/post-quantum-cryptography-migration-at-meta-framework-lessons-and-takeaways/\"\u003eMeta\u003c/a\u003e announcing that they target 2029 for full post-quantum migration. Filippo Valsorda also wrote about it earlier this month in \u003cem\u003e\u003ca href=\"https://words.filippo.io/crqc-timeline/\"\u003eA Cryptography Engineer’s Perspective on Quantum Computing Timelines\u003c/a\u003e\u003c/em\u003e.\u003c/p\u003e\n\u003cp\u003eCryptography is everywhere, and, as a developer you will need to upgrade your projects with post-quantum algorithms, whether because you care about the security of your users, or for compliance reasons.\u003c/p\u003e\n\u003cp\u003eFollowing the \u003ca href=\"https://www.latacora.com/blog/post-quantum-cryptographic-right-answers/\"\u003e\u003cem\u003eCryptographic Right Answers\u003c/em\u003e tradition\u003c/a\u003e, here are my recommendations for your post-quantum transition.\u003c/p\u003e\n\u003cp\u003eThis guide takes in account the security, availability and performance of standardized cryptographic algorithms to provide a short and actionnable list, with code snippets in Rust to avoid implementation errors.\u003c/p\u003e\n\u003ch2 id=\"the-quantum-threat\"\u003eThe quantum threat\u003c/h2\u003e\n\u003cp\u003eQuantum computers are a threat to traditional cryptography, more specifically to asymmetric cryptography (signatures and key exchange) with Shor's algorithm enabling fast factoring of big numbers, and, to a lesser extent, to symmetric cryptography due to Grover's algorithm which basically halves the security of symmetric primitives (i.e. algorithms offering 256-bit security offer only 128-bit security against quantum computers, \u003ca href=\"https://words.filippo.io/post-quantum-age/#128-bits-are-enough\"\u003ebut it's more complicated than that\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003eAs \u003ca href=\"https://en.wikipedia.org/wiki/Daniel_J._Bernstein\"\u003eDaniel J. Bernstein\u003c/a\u003e puts it, it's important to distinguish predictions regarding the timeline for three different events:\u003c/p\u003e\n\u003col\u003e\n\u003cli\u003eWell funded attackers secretly carrying out quantum attacks (against cryptography).\u003c/li\u003e\n\u003cli\u003ePublic demos of quantum attacks.\u003c/li\u003e\n\u003cli\u003eQuantum computers being useful for the public, not just attacks.\u003c/li\u003e\n\u003c/ol\u003e\n\u003cp\u003eTherefore, the moment that you will learn about quantum attacks in the news, it will already be too late.\u003c/p\u003e\n\u003ch2 id=\"which-rust-library-to-use\"\u003eWhich Rust library to use\u003c/h2\u003e\n\u003cp\u003e\u003cem\u003eIf you can't attack the math, attack the implementation\u003c/em\u003e\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003e37.2% of vulnerabilities in cryptographic libraries are memory safety issues\u003c/strong\u003e, while only 27.2%  are cryptographic issues, according to an \u003ca href=\"https://arxiv.org/abs/2107.04940\"\u003eempirical Study of Vulnerabilities in Cryptographic Libraries\u003c/a\u003e (\u003cem\u003eJenny Blessing, Michael A. Specter, Daniel J. Weitzner - MIT)\u003c/em\u003e.\u003c/p\u003e\n\u003cp\u003eA lot of attacks in the wild on crypto-related projects don't happen because the cryptographic algorithms used were unsound, but because of a vulnerable library or bad composition of primitives.\u003c/p\u003e\n\u003cp\u003eTherefore, it's crucial for the security of your systems to use safe and reviewed libraries.\u003c/p\u003e\n\u003cp\u003eAs mentioned in \u003cem\u003e\u003ca href=\"/rust-cryptography-ecosystem-2026\"\u003eTowards safe and modern cryptography: state of the Rust ecosystem in 2026\u003c/a\u003e\u003c/em\u003e there are 2 libraries / ecosystems that I currently recommend.\u003c/p\u003e\n\u003cp\u003eIf you are working only on servers, \u003ca href=\"https://github.com/aws/aws-lc-rs\"\u003e\u003ccode\u003eaws-lc-rs\u003c/code\u003e\u003c/a\u003e is a good choice because it's very fast and is developed by AWS, a well-resourced organization that has a lot of incentives to make this library secure.\u003c/p\u003e\n\u003cp\u003eUnfortunately, \u003ccode\u003eaws-lc-rs\u003c/code\u003e is only a wrapper for a C library \u003ccode\u003eaws-lc\u003c/code\u003e and is not available on all platforms, such as WebAssembly. Thus, \u003ca href=\"https://github.com/RustCrypto\"\u003eRust Crypto's\u003c/a\u003e ecosystem of pure-Rust cryptography is also a great choice, with many of its package have received professional 3rd party audits.\u003c/p\u003e\n\u003ch2 id=\"general-recommendations\"\u003eGeneral recommendations\u003c/h2\u003e\n\u003cp\u003eUse \u003cstrong\u003e256-bit keys\u003c/strong\u003e and \u003cstrong\u003e512-bit hashes\u003c/strong\u003e.\u003c/p\u003e\n\u003ch2 id=\"hashing\"\u003eHashing\u003c/h2\u003e\n\u003cp\u003eAs mentioned in \u003cem\u003e\u003ca href=\"/fast-secure-hash-function-sha256-sha512-sha3-blake3\"\u003eChoosing a hash function for 2030 and beyond: SHA-2 vs SHA-3 vs BLAKE3\u003c/a\u003e\u003c/em\u003e, I recommend \u003cstrong\u003eSHA-512\u003c/strong\u003e for hashing because it's \u0026quot;fast enough\u0026quot; (1GB+ / s / core) and provides a good security margin.\u003c/p\u003e\n\u003cpre style=\"color:#f8f8f2;background-color:#272822;-webkit-text-size-adjust:none;\"\u003e\u003ccode\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\u003cspan style=\"color:#66d9ef\"\u003efn\u003c/span\u003e \u003cspan style=\"color:#a6e22e\"\u003ehash_file\u003c/span\u003e(data: \u003cspan style=\"color:#66d9ef\"\u003e\u0026amp;\u003c/span\u003e[\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e]) -\u0026gt; [\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e; \u003cspan style=\"color:#ae81ff\"\u003e64\u003c/span\u003e] {\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e \u003cspan style=\"color:#66d9ef\"\u003emut\u003c/span\u003e hasher \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e Sha512::new();\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    hasher.update(data);\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#f92672\"\u003e*\u003c/span\u003ehasher.finalize().as_array().unwrap()\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e}\n\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eThe only situation where I would recommend to use SHA-256 or BLAKE3 is if you need ultra-fast hashing of large files for deduplication purpose. In all other situations SHA-512 is most certainly the better choice.\u003c/p\u003e\n\u003ch2 id=\"password--one-time-code-hashing\"\u003ePassword / One-time Code hashing\u003c/h2\u003e\n\u003cp\u003eYou need to use a specific family of algorithms to hash and store low-entropy data such as passwords or one-time codes. These hash functions are slow on purpose to greatly increase the cost of a bruteforce attack, and some can also be configured to use a determined amount of memory.\u003c/p\u003e\n\u003cp\u003eRecommended: \u003cstrong\u003eArgon2id\u003c/strong\u003e\u003c/p\u003e\n\u003cpre style=\"color:#f8f8f2;background-color:#272822;-webkit-text-size-adjust:none;\"\u003e\u003ccode\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\u003cspan style=\"color:#66d9ef\"\u003efn\u003c/span\u003e \u003cspan style=\"color:#a6e22e\"\u003ehash_password\u003c/span\u003e(password: \u003cspan style=\"color:#66d9ef\"\u003e\u0026amp;\u003c/span\u003e\u003cspan style=\"color:#66d9ef\"\u003estr\u003c/span\u003e) -\u0026gt; \u003cspan style=\"color:#a6e22e\"\u003eanyhow\u003c/span\u003e::Result\u003cspan style=\"color:#f92672\"\u003e\u0026lt;\u003c/span\u003eString\u003cspan style=\"color:#f92672\"\u003e\u0026gt;\u003c/span\u003e {\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e raw_salt: [\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e; \u003cspan style=\"color:#ae81ff\"\u003e32\u003c/span\u003e] \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e rand::random();\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e salt \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e SaltString::encode_b64(\u003cspan style=\"color:#f92672\"\u003e\u0026amp;\u003c/span\u003eraw_salt).map_err(\u003cspan style=\"color:#f92672\"\u003e|\u003c/span\u003eerr\u003cspan style=\"color:#f92672\"\u003e|\u003c/span\u003e \u003cspan style=\"color:#a6e22e\"\u003eanyhow!\u003c/span\u003e(\u003cspan style=\"color:#e6db74\"\u003e\u0026#34;error generating salt: {err}\u0026#34;\u003c/span\u003e))\u003cspan style=\"color:#f92672\"\u003e?\u003c/span\u003e;\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#75715e\"\u003e// Argon2 with default parameters (Argon2id v19)\n\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e argon2 \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e Argon2::new(argon2::Algorithm::Argon2id, argon2::Version::V0x13, argon2::Params::\u003cspan style=\"color:#66d9ef\"\u003eDEFAULT\u003c/span\u003e);\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    Ok(argon2\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e        .hash_password(password.as_bytes(), \u003cspan style=\"color:#f92672\"\u003e\u0026amp;\u003c/span\u003esalt)\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e        .map_err(\u003cspan style=\"color:#f92672\"\u003e|\u003c/span\u003eerr\u003cspan style=\"color:#f92672\"\u003e|\u003c/span\u003e \u003cspan style=\"color:#a6e22e\"\u003eanyhow!\u003c/span\u003e(\u003cspan style=\"color:#e6db74\"\u003e\u0026#34;error hashing password: {err}\u0026#34;\u003c/span\u003e))\u003cspan style=\"color:#f92672\"\u003e?\u003c/span\u003e\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e        .to_string())\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e}\n\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003ch2 id=\"key-derivation\"\u003eKey derivation\u003c/h2\u003e\n\u003cp\u003eKey derivation is used to derive a master key into multiple subkeys used for different purposes (e.g. one subkey for authentication, one subkey for encryption, see \u003ca href=\"https://kerkour.com/end-to-end-encryption-domain-separation-cryptography\"\u003eThe foundations of end-to-end encryption: Domain separation\u003c/a\u003e), or for \u0026quot;ratcheting\u0026quot; (see \u003ca href=\"https://kerkour.com/signal-protocol-double-ratchet-rust\"\u003eThe Signal Protocol Explained #2: Implementing the Double Ratchet Algorithm\u003c/a\u003e).\u003c/p\u003e\n\u003cp\u003eRecommended: \u003cstrong\u003eSHAKE256\u003c/strong\u003e (FIPS 202) or \u003cstrong\u003eHKDF-SHA512\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eI prefer to use SHAKE256 because HKDF shows it's age (salt? info?) but it's not always available (e.g. not available today in web browsers) and you need to be more conscious about how you feed the input, so HKDF-SHA512 is also a good choice.\u003c/p\u003e\n\u003cpre style=\"color:#f8f8f2;background-color:#272822;-webkit-text-size-adjust:none;\"\u003e\u003ccode\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\u003cspan style=\"color:#e6db74\"\u003e/// Derive a subkey of size `N` bytes using SHAKE256 (FIPS 202).\n\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\u003cspan style=\"color:#e6db74\"\u003e/// subkey = SHAKE256(info || info.lengthLittleEndian() || key || key.lengthLittleEndian(), N)\n\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\u003cspan style=\"color:#66d9ef\"\u003efn\u003c/span\u003e \u003cspan style=\"color:#a6e22e\"\u003ederive_key\u003c/span\u003e\u003cspan style=\"color:#f92672\"\u003e\u0026lt;\u003c/span\u003e\u003cspan style=\"color:#66d9ef\"\u003econst\u003c/span\u003e N: \u003cspan style=\"color:#66d9ef\"\u003eusize\u003c/span\u003e\u003cspan style=\"color:#f92672\"\u003e\u0026gt;\u003c/span\u003e(key: \u003cspan style=\"color:#66d9ef\"\u003e\u0026amp;\u003c/span\u003e[\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e], info: \u003cspan style=\"color:#66d9ef\"\u003e\u0026amp;\u003c/span\u003e\u003cspan style=\"color:#66d9ef\"\u003estr\u003c/span\u003e) -\u0026gt; [\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e; N] {\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e \u003cspan style=\"color:#66d9ef\"\u003emut\u003c/span\u003e kdf \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e Shake256::default();\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    kdf.update(info.as_bytes());\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    kdf.update(\u003cspan style=\"color:#f92672\"\u003e\u0026amp;\u003c/span\u003e(info.len() \u003cspan style=\"color:#66d9ef\"\u003eas\u003c/span\u003e \u003cspan style=\"color:#66d9ef\"\u003eu64\u003c/span\u003e).to_le_bytes());\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    kdf.update(key);\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    kdf.update(\u003cspan style=\"color:#f92672\"\u003e\u0026amp;\u003c/span\u003e(key.len() \u003cspan style=\"color:#66d9ef\"\u003eas\u003c/span\u003e \u003cspan style=\"color:#66d9ef\"\u003eu64\u003c/span\u003e).to_le_bytes());\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e \u003cspan style=\"color:#66d9ef\"\u003emut\u003c/span\u003e xof \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e kdf.finalize_xof();\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e \u003cspan style=\"color:#66d9ef\"\u003emut\u003c/span\u003e subkey \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e [\u003cspan style=\"color:#ae81ff\"\u003e0\u003c/span\u003e\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e; N];\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    xof.read(\u003cspan style=\"color:#f92672\"\u003e\u0026amp;\u003c/span\u003e\u003cspan style=\"color:#66d9ef\"\u003emut\u003c/span\u003e subkey);\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003ereturn\u003c/span\u003e subkey;\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e}\n\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003ch2 id=\"api-keys\"\u003eAPI Keys\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003eApiKey = prefix + version + Base32LowerCase.encode(UUID || 32-byte secret)\n\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eFor example: \u003ccode\u003epingoo_v1_e9n43c4499qe9a9q0zr5pj...\u003c/code\u003e\u003c/p\u003e\n\u003cpre style=\"color:#f8f8f2;background-color:#272822;-webkit-text-size-adjust:none;\"\u003e\u003ccode\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\u003cspan style=\"color:#75715e\"\u003e// store the api_key_id, organization_id, version and hash in database\n\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\u003cspan style=\"color:#66d9ef\"\u003efn\u003c/span\u003e \u003cspan style=\"color:#a6e22e\"\u003ehash_api_key\u003c/span\u003e(api_key_id: \u003cspan style=\"color:#a6e22e\"\u003eUuid\u003c/span\u003e, version \u003cspan style=\"color:#66d9ef\"\u003ei16\u003c/span\u003e, organization_id: \u003cspan style=\"color:#a6e22e\"\u003eUuid\u003c/span\u003e, secret: \u003cspan style=\"color:#66d9ef\"\u003e\u0026amp;\u003c/span\u003e[\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e]) -\u0026gt; [\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e; \u003cspan style=\"color:#ae81ff\"\u003e64\u003c/span\u003e] {\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#75715e\"\u003e// There is no need to append the length of the different parts because they are fixed-size\n\u003c/span\u003e\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e \u003cspan style=\"color:#66d9ef\"\u003emut\u003c/span\u003e hasher \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e Shake256::default();\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    hasher.update(api_key_id.as_bytes());\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    hasher.update(\u003cspan style=\"color:#f92672\"\u003e\u0026amp;\u003c/span\u003eversion.to_le_bytes());\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    hasher.update(organization_id.as_bytes());\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    hasher.update(secret);\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e \u003cspan style=\"color:#66d9ef\"\u003emut\u003c/span\u003e xof \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e kdf.finalize_xof();\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e \u003cspan style=\"color:#66d9ef\"\u003emut\u003c/span\u003e hash \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e [\u003cspan style=\"color:#ae81ff\"\u003e0\u003c/span\u003e\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e; \u003cspan style=\"color:#ae81ff\"\u003e64\u003c/span\u003e];\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    xof.read(\u003cspan style=\"color:#f92672\"\u003e\u0026amp;\u003c/span\u003e\u003cspan style=\"color:#66d9ef\"\u003emut\u003c/span\u003e hash);\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003ereturn\u003c/span\u003e hash;\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e}\n\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003cp\u003eRecommended: \u003cstrong\u003eSHAKE256\u003c/strong\u003e with a 512-bit output, or \u003cstrong\u003eSHA3-512\u003c/strong\u003e, or \u003cstrong\u003eSHA-512\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eSee \u003ca href=\"/api-keys\"\u003eHow to implement cryptographically-secure API keys\u003c/a\u003e for details and the complete code.\u003c/p\u003e\n\u003ch2 id=\"encryption\"\u003eEncryption\u003c/h2\u003e\n\u003cp\u003eRecommended: \u003cstrong\u003eAES-256-GCM\u003c/strong\u003e or \u003cstrong\u003e\u003ca href=\"/chacha20-blake3\"\u003eChaCha20-BLAKE3\u003c/a\u003e\u003c/strong\u003e or \u003cstrong\u003eXChaCha20-Poly1305\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eAES-256\u003c/code\u003e is \u003cem\u003ethe military-grade encryption\u003c/em\u003e algorithm that everybody love to talk about and is probably the safest / most conservative choice, but it also has too short nonces, key / nonce reuse is catastrophic and it's also lacking context commitment (see \u003ca href=\"/aes-context-commitment\"\u003eFull context commitment for AES authenticated encryption\u003c/a\u003e) which may lead to real-world vulnerabilities such as  \u003cem\u003e\u003ca href=\"https://eprint.iacr.org/2019/016\"\u003eInvisible Salamanders\u003c/a\u003e\u003c/em\u003e or \u003ca href=\"https://eprint.iacr.org/2020/1491\"\u003epartitioning oracle attacks\u003c/a\u003e. See \u003ca href=\"https://soatok.blog/2020/05/13/why-aes-gcm-sucks/\"\u003eWhy AES-GCM Sucks\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eXChaCha20-Poly1305\u003c/code\u003e has longer nonces that are safe to generate randomly but is also lacking context commitment, that's why if you don't need to use \u003ccode\u003eAES\u003c/code\u003e for compliance reasons, I recommend \u003ccode\u003eChaCha20-BLAKE3\u003c/code\u003e which commits the full context and is both safer and faster than other \u003ccode\u003eChaCha20\u003c/code\u003e-derived functions.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eImportant\u003c/strong\u003e: reusing a key / nonce pair is catastrophic with \u003ccode\u003eAES-GCM\u003c/code\u003e and \u003ccode\u003eChaCha20\u003c/code\u003e-derived functions. That's why you should either use an extended nonce construction such as \u003ccode\u003eChaCha20-BLAKE3\u003c/code\u003e or \u003ccode\u003eXChaCha20-Poly1305\u003c/code\u003e, or use unique keys and nonces for every encryption.\u003c/p\u003e\n\u003cpre style=\"color:#f8f8f2;background-color:#272822;-webkit-text-size-adjust:none;\"\u003e\u003ccode\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\u003cspan style=\"color:#66d9ef\"\u003efn\u003c/span\u003e \u003cspan style=\"color:#a6e22e\"\u003eencrypt\u003c/span\u003e(data: \u003cspan style=\"color:#66d9ef\"\u003e\u0026amp;\u003c/span\u003e[\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e]) {\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e key: [\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e; \u003cspan style=\"color:#ae81ff\"\u003e32\u003c/span\u003e] \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e rand::random();\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e nonce: [\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e; \u003cspan style=\"color:#ae81ff\"\u003e12\u003c/span\u003e] \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e rand::random();\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e aes_256_gcm_cipher \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e Aes256Gcm::new(key.as_slice().into());\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e encrypted_data \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e aes_256_gcm_cipher\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e        .encrypt(\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e            \u003cspan style=\"color:#f92672\"\u003e\u0026amp;\u003c/span\u003enonce.into(),\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e            Payload {\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e                msg: \u003cspan style=\"color:#a6e22e\"\u003edata\u003c/span\u003e,\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e                aad: \u003cspan style=\"color:#66d9ef\"\u003e\u0026amp;\u003c/span\u003e[],\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e            },\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e        )\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e        .unwrap();\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e}\n\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003ch2 id=\"encrypting-secrets\"\u003eEncrypting secrets\u003c/h2\u003e\n\u003cp\u003eIf you are developing a backend service that needs to securely store sensitive data such as user-provided secrets or API keys, you want to encrypt it.\u003c/p\u003e\n\u003cp\u003eFor that, you need a Key Management Service (KMS) which provides an hardware-backed encryption API. You then use envelope encryption to encrypt the data on your servers with a data key, and encrypt the data key with the KMS encryption API, so the KMS service never sees the sensitive data.\u003c/p\u003e\n\u003cp\u003eRecommended: \u003cstrong\u003eKMS + envelope encryption with an AEAD\u003c/strong\u003e\u003c/p\u003e\n\u003cimg src=\"https://kerkour.com/assets/2025/05/kms_envelope_encryption.png\" height=\"300\" alt=\"envelope encryption with KMS\" style=\"height: 300px\" /\u003e\n\u003cp\u003eSee \u003ca href=\"/rust-secrets-kms-envelope-encryption\"\u003eHow to securely encrypt your sensitive data with envelope encryption and KMS\u003c/a\u003e for more details and code.\u003c/p\u003e\n\u003cblockquote\u003e\n\u003cp\u003eWant to learn applied cryptography, security engineering and how to write secure and production-ready Rust? Take a look at my book \u003cstrong\u003e\u003ca href=\"/black-hat-rust\"\u003eBlack Hat Rust\u003c/a\u003e which is currently in promotion\u003c/strong\u003e where, among other things, you will design an end-to-end encrypted protocol to control a Remote Access Tool, build a web server, and write shellcode and exploits in no_std Rust instead of assembly.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003ch2 id=\"key-exchange\"\u003eKey exchange\u003c/h2\u003e\n\u003cp\u003ePost-quantum key exchange algorithms must be deployed as soon as possible in order to mitigate store-now-decrypt-later attacks, where an adversary would intercept the data today, store it, and decrypt it later when a quantum computer is available.\u003c/p\u003e\n\u003cp\u003eThere is a wide consensus among security engineers that we should use hybrid key exchange algorithms by combining both classical elliptic curve-based key exchange (e.g. X25519) and post-quantum Key Encapsulation Mechanism (KEM) such as ML-KEM (FIPS 203) so that if the post-quantum algorithms are found to be weaker than initially thought, the elliptic curve part will at least protect the data against all adversaries who don't have access to a quantum computer.\u003c/p\u003e\n\u003cp\u003eThe most \u0026quot;popular\u0026quot; hybrid KEM today is X-Wing, which is currently an \u003ca href=\"https://datatracker.ietf.org/doc/draft-connolly-cfrg-xwing-kem/\"\u003eIETF draft: X-Wing: general-purpose hybrid post-quantum KEM\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eRecommended: \u003cstrong\u003eX-Wing (X25519 + ML-KEM-768)\u003c/strong\u003e\u003c/p\u003e\n\u003ch2 id=\"symmetric-signatures\"\u003eSymmetric \u0026quot;signatures\u0026quot;\u003c/h2\u003e\n\u003cp\u003eHere nothing changes.\u003c/p\u003e\n\u003cp\u003eRecommended: \u003cstrong\u003eHMAC-SHA512\u003c/strong\u003e\u003c/p\u003e\n\u003cpre style=\"color:#f8f8f2;background-color:#272822;-webkit-text-size-adjust:none;\"\u003e\u003ccode\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\u003cspan style=\"color:#66d9ef\"\u003efn\u003c/span\u003e \u003cspan style=\"color:#a6e22e\"\u003esign\u003c/span\u003e(secret: \u003cspan style=\"color:#66d9ef\"\u003e\u0026amp;\u003c/span\u003e[\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e], data: \u003cspan style=\"color:#66d9ef\"\u003e\u0026amp;\u003c/span\u003e[\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e]) -\u0026gt; \u003cspan style=\"color:#a6e22e\"\u003eanyhow\u003c/span\u003e::Result\u003cspan style=\"color:#f92672\"\u003e\u0026lt;\u003c/span\u003e[\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e; \u003cspan style=\"color:#ae81ff\"\u003e64\u003c/span\u003e]\u003cspan style=\"color:#f92672\"\u003e\u0026gt;\u003c/span\u003e {\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e \u003cspan style=\"color:#66d9ef\"\u003emut\u003c/span\u003e hasher: \u003cspan style=\"color:#a6e22e\"\u003eHmac\u003c/span\u003e\u003cspan style=\"color:#f92672\"\u003e\u0026lt;\u003c/span\u003eSha512\u003cspan style=\"color:#f92672\"\u003e\u0026gt;\u003c/span\u003e \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e Hmac::new_from_slice(secret)\u003cspan style=\"color:#f92672\"\u003e?\u003c/span\u003e;\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    hasher.update(data);\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    Ok(\u003cspan style=\"color:#f92672\"\u003e*\u003c/span\u003ehasher.finalize().as_bytes().as_array().unwrap())\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e}\n\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003ch2 id=\"asymmetric-signatures\"\u003eAsymmetric signatures\u003c/h2\u003e\n\u003cp\u003eWhile most cryptographers recommend hybrid key exchange constructions, I don't see the same enthusiasm regarding hybrid signature schemes, therefore, today, I only recommend pure post-quantum ML-DSA (FIPS 204).\u003c/p\u003e\n\u003cp\u003eRecommended: \u003cstrong\u003eML-DSA-65\u003c/strong\u003e, or \u003cstrong\u003eML-DSA-87\u003c/strong\u003e if your need maximum and / or long-term security.\u003c/p\u003e\n\u003cpre style=\"color:#f8f8f2;background-color:#272822;-webkit-text-size-adjust:none;\"\u003e\u003ccode\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\u003cspan style=\"color:#66d9ef\"\u003efn\u003c/span\u003e \u003cspan style=\"color:#a6e22e\"\u003esign_and_verify\u003c/span\u003e(data: \u003cspan style=\"color:#66d9ef\"\u003e\u0026amp;\u003c/span\u003e[\u003cspan style=\"color:#66d9ef\"\u003eu8\u003c/span\u003e]) {\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e \u003cspan style=\"color:#66d9ef\"\u003emut\u003c/span\u003e keypair \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e MlDsa65::key_gen(\u003cspan style=\"color:#f92672\"\u003e\u0026amp;\u003c/span\u003e\u003cspan style=\"color:#66d9ef\"\u003emut\u003c/span\u003e OsRng);\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#66d9ef\"\u003elet\u003c/span\u003e signature \u003cspan style=\"color:#f92672\"\u003e=\u003c/span\u003e keypair.signing_key().sign(data);\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e    \u003cspan style=\"color:#a6e22e\"\u003eassert!\u003c/span\u003e(keypair.verifying_key().verify(data, \u003cspan style=\"color:#f92672\"\u003e\u0026amp;\u003c/span\u003esignature).is_ok());\n\u003c/span\u003e\u003c/span\u003e\u003cspan style=\"display:flex;\"\u003e\u003cspan\u003e}\n\u003c/span\u003e\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003ch2 id=\"json-web-tokens\"\u003eJSON Web Tokens\u003c/h2\u003e\n\u003cp\u003eJSON Web Tokens are generally short-lived and should be fast to verify both for scalability reasons and to avoid Denial of Service attacks.\u003c/p\u003e\n\u003cp\u003eRecommended: \u003cstrong\u003eML-DSA-65\u003c/strong\u003e for asymmetric signatures or \u003cstrong\u003eHMAC-SHA512\u003c/strong\u003e (\u003ccode\u003eHS512\u003c/code\u003e) for symmetric signatures (e.g. in monoliths).\u003c/p\u003e\n\u003ch2 id=\"end-to-end-encryption\"\u003eEnd-to-end encryption\u003c/h2\u003e\n\u003cp\u003eWhile you probably need more advanced protocols for your specific use case (e.g. The Messaging Layer Security Protocol, MLS, standardized in \u003ca href=\"https://www.rfc-editor.org/rfc/rfc9420.html\"\u003eRFC 9420\u003c/a\u003e, for messaging), basic end-to-end encryption to a public key has been standardized in \u003ca href=\"https://www.rfc-editor.org/rfc/rfc9180.html\"\u003eRFC 9180 - Hybrid Public Key Encryption (HPKE)\u003c/a\u003e. In this context, \u003cem\u003ehybrid\u003c/em\u003e means that we combine both symmetric and asymmetric cryptography.\u003c/p\u003e\n\u003cp\u003eTherefore, I recommend the following algorithms for use with HPKE to encrypt data to a public key:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eKEM: X-Wing\u003c/li\u003e\n\u003cli\u003eAEAD: AES-256-GCM\u003c/li\u003e\n\u003cli\u003eKDF: HKDF-SHA512\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eNote\u003c/strong\u003e: HPKE can be and is used as a building block for more advanced protocols. For example, MLS uses it under the hood.\u003c/p\u003e\n\u003ch2 id=\"tls\"\u003eTLS\u003c/h2\u003e\n\u003cp\u003eToday, the only quantum-resistant key exchange algorithm available for TLS is the hybrid \u003ccode\u003eX25519MLKEM768\u003c/code\u003e. Ensure that your load balancers / reverse proxies support it.\u003c/p\u003e\n\u003cp\u003e\u003ca href=\"https://github.com/pingooio/pingoo\"\u003ePingoo\u003c/a\u003e and \u003ccode\u003eaws-lc-rs\u003c/code\u003e (when used as a CryptoProvider for \u003ccode\u003erustls\u003c/code\u003e) both support \u003ccode\u003eX25519MLKEM768\u003c/code\u003e.\u003c/p\u003e\n\u003ch2 id=\"closing-thoughts\"\u003eClosing Thoughts\u003c/h2\u003e\n\u003cp\u003eI know that cryptography is not a top priority for a lot of organizations, but time flies fast, and most of your users / customers will probably require quantum-resistant cryptography well before 2030 so they can check their own compliance forms and boxes. That's why I recommend pure-software organizations to have a roadmap to migrate to post-quantum cryptography before the end of 2026.\u003c/p\u003e\n\u003cp\u003eI may be a little bit more extreme than others, but I believe that migrating to quantum-resistant cryptography is not the most important \u003cem\u003eper se\u003c/em\u003e. What is important is to have infrastructure and processes in place to migrate your crypto algorithms, whether to get post-quantum security or to mitigate weaknesses found in algorithms that were once considered secure.\u003c/p\u003e\n\u003cp\u003eNow, if you want to learn more about how to secure your Rust projects, take a look at \u003ca href=\"/rust-supply-chain-nightmare\"\u003eSupply chain nightmare: How Rust will be attacked and what we can do to mitigate the inevitable\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eIf you want to learn SIMD programming, take a look at \u003ca href=\"/introduction-rust-simd\"\u003eSIMD programming in pure Rust\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eIf you want to learn backend development with Rust, take a look at my article \u003ca href=\"/rust-web-services-axum-sqlx-postgresql\"\u003eArchitecting and building medium-sized web services in Rust with Axum, SQLx and PostgreSQL\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eIf you want to learn embedded development, take a look at \u003ca href=\"/introduction-to-embedded-development-with-rust\"\u003eIntroduction to embedded development with Rust: Overview of the ecosystem\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eAnd if you want to learn how to do black-wizard things such as applied cryptography, security engineering, how to write secure and production-ready Rust code, take a look at my book \u003cstrong\u003e\u003ca href=\"/black-hat-rust\"\u003eBlack Hat Rust\u003c/a\u003e\u003c/strong\u003e where, from theory to practice, you will build an end-to-end encryption protocol, exploits, a Remote Access Tool, craft shellcodes in pure Rust and many other things to get your hands dirty.\u003c/p\u003e\n"},"contact":null};
