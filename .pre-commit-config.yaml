repos:
  # TAURUS brand guard. Rules are generated from the org-wide single source of
  # truth at ~/.ai-context/taxonomy/TAXONOMY.toml, which knows that naming form
  # differs per platform — "Nexus Social" is correct space form, while
  # "GRIDERA Comply" is a violation.  # brand-allow
  # Added as a local hook rather than via core.hooksPath, which would have
  # disabled this framework and git-lfs.
  # Skips silently if the taxonomy repo is not present on this machine.
  - repo: local
    hooks:
      - id: taurus-brand-guard
        name: TAURUS brand guard
        language: system
        pass_filenames: false
        always_run: true
        entry: >-
          bash -c 'g="$HOME/.ai-context/taxonomy/scripts/check-brand.sh";
          [ -x "$g" ] && exec "$g" || exit 0'
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.5
    hooks:
      - id: ruff
        args: [--fix, --config, 01-CORE-PLATFORM/nexus-backend/pyproject.toml]
        types_or: [python, pyi]
        exclude: '^planning/'
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.25.0
    hooks:
      - id: eslint
        args: [--config, eslint.config.mjs]
        types_or: [javascript, jsx, ts, tsx]
        exclude: '^planning/'
        additional_dependencies:
          - eslint@9
          - '@eslint/js'
          - typescript-eslint
          - eslint-plugin-react
          - eslint-plugin-react-hooks
