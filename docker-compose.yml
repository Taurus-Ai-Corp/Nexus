version: '3.8'

services:
  # ===========================================
  # NEXUS BACKEND - FastAPI
  # ===========================================
  nexus-backend:
    build:
      context: ./01-CORE-PLATFORM/nexus-backend
      dockerfile: Dockerfile
    container_name: nexus-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${SUPABASE_DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - HUBSPOT_ACCESS_TOKEN=${HUBSPOT_ACCESS_TOKEN}
      - MONGODB_URI=${MONGODB_URI}
      - PLANETSCALE_URL=${PLANETSCALE_URL}
    depends_on:
      - redis
    volumes:
      - ./01-CORE-PLATFORM/nexus-backend:/app
    networks:
      - nexus-network
    restart: unless-stopped

  # ===========================================
  # NEXUS FRONTEND - Next.js
  # ===========================================
  nexus-frontend:
    build:
      context: ./01-CORE-PLATFORM/nexus-frontend
      dockerfile: Dockerfile
    container_name: nexus-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://nexus-backend:8000
    depends_on:
      - nexus-backend
    volumes:
      - ./01-CORE-PLATFORM/nexus-frontend:/app
      - /app/node_modules
    networks:
      - nexus-network
    restart: unless-stopped

  # ===========================================
  # NEXUS CREATIVE STUDIO
  # ===========================================
  nexus-studio:
    build:
      context: ./01-CORE-PLATFORM/nexus-studio
      dockerfile: Dockerfile
    container_name: nexus-studio
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://nexus-backend:8000
    depends_on:
      - nexus-backend
    networks:
      - nexus-network
    restart: unless-stopped

  # ===========================================
  # REDIS - Caching & Sessions
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nexus-network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # ===========================================
  # POSTGRES - Local Development (mirrors Supabase)
  # ===========================================
  postgres:
    image: postgres:15-alpine
    container_name: nexus-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nexus}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nexus_dev}
      - POSTGRES_DB=${POSTGRES_DB:-nexus_dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./05-DATABASES/supabase/schemas:/docker-entrypoint-initdb.d
    networks:
      - nexus-network
    restart: unless-stopped

  # ===========================================
  # MONGODB - Local Development (mirrors Atlas)
  # ===========================================
  mongodb:
    image: mongo:7
    container_name: nexus-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-nexus}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-nexus_dev}
      - MONGO_INITDB_DATABASE=nexus
    volumes:
      - mongodb-data:/data/db
      - ./05-DATABASES/mongodb-atlas/schemas:/docker-entrypoint-initdb.d
    networks:
      - nexus-network
    restart: unless-stopped

  # ===========================================
  # N8N - Workflow Automation
  # ===========================================
  n8n:
    image: n8nio/n8n:latest
    container_name: nexus-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-nexus_n8n}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n-data:/home/node/.n8n
      - ./06-WORKFLOWS/n8n:/home/node/workflows
    networks:
      - nexus-network
    restart: unless-stopped

  # ===========================================
  # AGENT ORCHESTRATOR
  # ===========================================
  agent-orchestrator:
    build:
      context: ./02-AGENTS/orchestration
      dockerfile: Dockerfile
    container_name: nexus-orchestrator
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=${SUPABASE_DATABASE_URL}
      - HUBSPOT_ACCESS_TOKEN=${HUBSPOT_ACCESS_TOKEN}
    depends_on:
      - redis
      - nexus-backend
    volumes:
      - ./02-AGENTS:/app/agents
    networks:
      - nexus-network
    restart: unless-stopped

networks:
  nexus-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mongodb-data:
  n8n-data:
